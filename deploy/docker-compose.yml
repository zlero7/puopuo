# 서버 + 자동 HTTPS(Caddy) 한 번에 띄우기
#   1) 이 폴더에서 .env 파일을 만들기:  cp .env.example .env  후 DOMAIN · AUTH_SECRET 채우기
#   2) docker compose up -d --build
#   3) 앱의 서버 주소: https://<DOMAIN>
# 도메인의 A 레코드가 이 서버 IP를 가리키고, 80·443 포트가 열려 있어야 인증서가 자동으로 발급됨
services:
  puyo:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET을 .env에 넣어 주세요(openssl rand -hex 32)}
      MIN_CLIENT_VERSION: ${MIN_CLIENT_VERSION:-0.0.0}
      MAX_CONNS: ${MAX_CONNS:-2000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-puyo://app}
    volumes:
      - puyo-data:/data
    expose: ["3000"]            # 밖으로 열지 않고 Caddy만 접근
    read_only: true             # 실행 중 파일 시스템을 읽기 전용으로(쓰는 곳은 /data와 임시 폴더만)
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [puyo]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN을 .env에 넣어 주세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  puyo-data:
  caddy-data:
  caddy-config:
