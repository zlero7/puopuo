# 집 PC용(포트포워딩 없이): Cloudflare Tunnel로 HTTPS 공개. 공유기 포트를 열지 않고 집 IP도 드러나지 않음
#   준비: 도메인(zlero.xyz)의 DNS를 Cloudflare에 두고, Zero Trust 대시보드 → Networks → Tunnels 에서 터널을 만들어 토큰을 받음
#         터널의 Public hostname:  puyo.zlero.xyz  →  Service: HTTP  puyo:3000
#   실행: deploy/.env 에 AUTH_SECRET · TUNNEL_TOKEN 을 채우고  docker compose -f docker-compose.tunnel.yml up -d --build
services:
  puyo:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET을 .env에 넣어 주세요(openssl rand -hex 32)}
      MIN_CLIENT_VERSION: ${MIN_CLIENT_VERSION:-0.0.0}
      MAX_CONNS: ${MAX_CONNS:-2000}
    volumes:
      - puyo-data:/data
    expose: ["3000"]            # 밖으로 열지 않고 터널(cloudflared)만 접근
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on: [puyo]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN을 .env에 넣어 주세요}
volumes:
  puyo-data:
