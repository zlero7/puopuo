# 다운로드 사이트(puyopuyo.zlero.xyz) 배포: site/ 와 사이트가 쓰는 글꼴·그림이 바뀌면 GitHub Pages에 올림
# 처음 한 번 할 일은 docs/DOWNLOAD-SITE.md 참고(저장소 Settings > Pages, DNS)
name: 다운로드 사이트
on:
  push:
    branches: [claude/desktop-app-exe]
    paths: ['site/**', 'tools/build-site.js', 'public/fonts/**', 'public/img/chars_icon.webp', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-site.js _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
