# 데스크톱 앱(exe) 빌드 · 서버 테스트
# - 브랜치에 푸시하거나 Actions 탭에서 'Run workflow'를 누르면 결과물이 '아티팩트'로 올라옴(30일 보관)
# - v로 시작하는 태그(예: v1.0.0)를 푸시하면 같은 파일이 GitHub 릴리스에도 붙음
# - 자동 배포: 앱 브랜치에 푸시했을 때 앱 파일(public/ electron/ build/ tools/ package.json)이 바뀌었고 테스트·exe 스모크가 모두 통과하면
#   버전을 자동으로 붙여(많이 바뀌면 x.0.0, 적당하면 0.x.0, 사소하면 0.0.x — docs/UPDATES.md) 릴리스를 만들고 서명한 화면 업데이트 파일을 올림 → 사용자 앱이 켤 때 알아서 받음
#   (배포를 건너뛰려면 커밋 제목에 [skip release], 앱 파일이 안 바뀌어도 배포하려면 Actions 탭 Run workflow에서 release 체크. 앱 본체가 바뀌어 설치 파일이 꼭 필요하면 electron/shell-api.json의 숫자를 올릴 것)
name: 앱(exe) 빌드

on:
  push:
    branches: [claude/desktop-app-exe]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: '앱 파일이 안 바뀌었어도 지금 배포할까요?'
        type: boolean
        default: false
      bump:
        description: '올릴 버전 단계(자동은 변경량으로 정함)'
        type: choice
        options: [auto, major, minor, patch]
        default: auto

permissions:
  contents: write

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  # 서버: 계정·인증·랭크 규칙·안정성 테스트(브라우저가 필요한 테스트는 개발 환경에서 따로)
  server:
    name: 서버 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:auth
      - run: npm run test:rank
      - run: npm run test:robust
      - run: npm run test:updater
      - run: npm run test:backup
      - run: npm run test:version

  # 서버 이미지가 빌드되고 실제로 켜지는지
  docker:
    name: 서버 이미지 확인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t puyo-server .
      - name: 켜 보고 /health · 보안 설정 확인
        run: |
          docker run -d --name puyo -p 3000:3000 -e AUTH_SECRET=ci-secret-ci-secret-ci-secret-ci-secret-1234 puyo-server
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3000/health && break || sleep 1; done
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = "404"        # 웹 화면은 제공하지 않음
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"id":"cituser01","name":"CI","pw":"Zx9!kqwe12"}' http://127.0.0.1:3000/auth/register)" = "201"
          docker logs puyo | head -20
          docker rm -f puyo

  windows:
    name: Windows exe
    needs: [server, docker]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Windows 서버 설치 스크립트 문법 확인
        shell: pwsh
        run: |
          foreach ($f in 'deploy\windows\setup.ps1', 'deploy\windows\run-server.ps1') {
            $errs = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { Write-Host $_.Message }; throw "$f 문법 오류" } else { Write-Host "$f OK" }
          }
      - name: 자동 배포할지·버전 정하기
        id: rel
        shell: bash
        run: |
          go=no
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release }}" = "true" ] && [ "${{ github.ref }}" = "refs/heads/claude/desktop-app-exe" ]; then go=yes
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/claude/desktop-app-exe" ]; then
            if git log -1 --format=%s | grep -qi '\[skip release\]'; then go=no
            else
              before="${{ github.event.before }}"
              if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then files=$(git ls-files)
              else files=$(git diff --name-only "$before" "${{ github.sha }}"); fi
              if echo "$files" | grep -Eq '^(public/|electron/|build/|tools/|package(-lock)?\.json$)'; then go=yes; fi
            fi
          fi
          ver=""
          if [ "$go" = "yes" ]; then
            # 마지막 릴리스 기준으로 변경량에 따라 올림: 아주 많이 바뀌면 x.0.0, 적당히 바뀌면 0.x.0, 사소하면 0.0.x (커밋 제목의 [major] [minor] [patch]로 직접 정할 수도 있음)
            out=$(node tools/next-version.js --level "${{ inputs.bump || 'auto' }}")
            ver=${out%% *}; lvl=${out##* }; echo "버전 단계: $lvl"
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          case "${lvl:-}" in major) kind="큰 변경";; minor) kind="적당한 변경";; *) kind="사소한 변경";; esac
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "자동 배포: $go ($ver)"
      - name: 자동 배포 버전을 앱 버전으로
        if: steps.rel.outputs.go == 'yes'
        shell: bash
        run: npm version "${{ steps.rel.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: 태그 버전을 앱 버전으로(v1.0.1 → 1.0.1)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: exe 만들기
        run: npm run app:win
      - name: exe 스모크 테스트(만든 exe가 실제로 뜨고, 화면이 상자 안에 갇혀 있는지)
        shell: pwsh
        run: |
          $env:PUYO_SMOKE_OUT = "$PWD\smoke.json"
          $p = Start-Process -FilePath "dist\win-unpacked\PuyoPuyo.exe" -ArgumentList "--smoke" -PassThru -Wait
          if (Test-Path smoke.json) { Get-Content smoke.json } else { Write-Host "smoke.json이 없어요(앱이 뜨지 못함)" }
          if ($p.ExitCode -ne 0) { throw "스모크 테스트 실패(종료 코드 $($p.ExitCode))" }
      - name: 화면 업데이트 묶음 만들기·서명(태그·자동 배포일 때)
        if: startsWith(github.ref, 'refs/tags/v') || steps.rel.outputs.go == 'yes'
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p dist
          # 직전 릴리스의 매니페스트를 받아 두면 바뀐 파일만 담은 작은 패치도 만듦(없으면 전체 묶음만)
          curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/ui-manifest.json" -o dist/prev-manifest.json || rm -f dist/prev-manifest.json
          node tools/build-ui-bundle.js
      - uses: actions/upload-artifact@v4
        with:
          name: PuyoPuyo-windows
          path: |
            dist/*.exe
          if-no-files-found: error
      - name: 릴리스에 붙이기(태그일 때만)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/ui/*
      - name: 자동 배포 릴리스 만들기
        if: steps.rel.outputs.go == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.rel.outputs.version }} · ${{ steps.rel.outputs.kind }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          files: |
            dist/*.exe
            dist/ui/*
