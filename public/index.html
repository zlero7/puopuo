<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뿌요뿌요</title>
<link rel="stylesheet" href="fonts/fonts.css">   <!-- 글꼴은 외부(구글 폰트)에서 받지 않고 앱에 내장 -->
<style>
  :root {
    --font: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --head: "Black Han Sans", "Jua", "Malgun Gothic", sans-serif;
    --ink: #22212e; --muted: #6d6b80;
    --bandH: clamp(58px, 10vh, 92px); --footH: clamp(46px, 8vh, 70px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--ink); font-family: var(--font);
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.55) 0 3px, transparent 3px 28px),
      linear-gradient(180deg, #eef0f5, #d9dbe5);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(var(--bandH) + 10px + env(safe-area-inset-top, 0px)) 8px calc(var(--footH) + 6px + env(safe-area-inset-bottom, 0px));
    overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .hidden { display: none !important; }
  .gear { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); right: 14px; z-index: 6; font-family: var(--head); font-size: 16px;
    border: 0; border-radius: 999px; padding: 6px 14px; background: #2f78f0; color: #fff; cursor: pointer; box-shadow: 0 3px 0 #1747b0; }
  .gear.acct { right: 118px; background: #ff7a2f; box-shadow: 0 3px 0 #b34a0e; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #acct h3 { margin: 0 0 8px; }
  .actabs { display: flex; gap: 8px; margin-bottom: 10px; }
  .actabs button { flex: 1; font-family: var(--head); font-size: 17px; padding: 6px 0; border: 2px solid #cfd1dc; border-radius: 8px; background: #fff; color: var(--muted); cursor: pointer; }
  .actabs button.on { border-color: #2f78f0; color: #2f78f0; }
  #acct label { display: block; font-size: 14px; color: var(--muted); margin: 8px 0 3px; }
  #acct input { width: 100%; box-sizing: border-box; font-family: var(--font); font-size: 18px; padding: 7px 10px; border: 2px solid #cfd1dc; border-radius: 6px; }
  #acct input:focus { outline: 0; border-color: #2f78f0; }
  .acmsg { min-height: 20px; font-size: 14px; margin: 8px 0 0; color: var(--muted); }
  .acmsg.bad { color: #d6263f; }
  .acsec { margin-top: 14px; padding-top: 10px; border-top: 2px dashed #dcdde8; }
  .acsec small { color: var(--muted); }
  .modal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(26,20,60,0.5); padding: 16px; }
  .setcard { width: min(560px, 100%); max-height: 90vh; }
  .setchk { display: flex; align-items: center; gap: 10px; font-size: 16px; margin-bottom: 8px; cursor: pointer; }
  .setchk input { width: 20px; height: 20px; accent-color: #2f78f0; flex: none; }
  .setchk small { display: block; font-size: 13px; color: var(--muted); }
  #rkfx { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 18; cursor: pointer; backdrop-filter: blur(6px); }
  .setcard h3 small { font-family: var(--font); font-size: 13px; color: var(--muted); }
  .setrow { display: grid; grid-template-columns: 90px 1fr 48px; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 16px; }
  .keylist { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 8px; align-items: center; font-size: 15px; margin-bottom: 8px; }
  .keylist button { font-family: var(--font); font-size: 14px; min-width: 110px; padding: 5px 8px; border: 2px solid #cfd1dc; border-radius: 6px; background: #f6f6fa; cursor: pointer; }
  .keylist button.wait { border-color: #2f78f0; background: #e6efff; }
  .padinfo { font-size: 14px; color: var(--muted); margin: 6px 0 10px; }
  .stylebar {
    grid-column: 1 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; background: #fff;
    border: 3px solid #cfd1dc; border-radius: 6px; padding: 7px 14px; box-shadow: 0 4px 0 rgba(0,0,0,0.06);
  }
  .stylebar .lab { font-family: var(--head); font-size: 17px; color: #3a3850; white-space: nowrap; flex: none; }
  .segs { display: flex; background: #e9eaf1; border-radius: 999px; padding: 3px; }
  .stylebar .grp { display: flex; align-items: center; gap: 8px; max-width: 100%; }   /* 이름표와 버튼 묶음이 따로 줄바꿈되지 않게 */
  .stylebar .segs { flex-wrap: wrap; }
  .seg { white-space: nowrap; font-family: var(--head); font-size: 16px; border: 0; background: transparent; color: #6d6b80; padding: 6px 16px; border-radius: 999px; cursor: pointer; }
  .seg.on { background: var(--c); color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,0.2); }
  .seg:focus-visible, .seg:focus { outline: 3px solid #1f74f0; outline-offset: 1px; }

  /* ---------- 위·아래 사선 띠 ---------- */
  .band-top {
    position: fixed; left: 0; top: 0; z-index: 5; height: calc(var(--bandH) + env(safe-area-inset-top, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    width: max-content; min-width: min(62vw, 720px); max-width: 100vw; padding-right: 110px; box-sizing: border-box;   /* 매칭 표시가 붙으면 띠가 늘어남 */
    background: linear-gradient(90deg, #ff2b47, #ff6a1f 70%, #ff8f1f);
    clip-path: polygon(0 0, 100% 0, 86% 100%, 0 100%); display: flex; align-items: center;
  }
  .band-top h1 {
    white-space: nowrap; margin: 0; padding-left: clamp(18px, 5vw, 64px); font-family: var(--head); font-weight: 400;
    font-size: clamp(24px, 4.4vh, 42px); color: #fff; letter-spacing: 1px; text-shadow: 0 3px 0 rgba(120, 10, 20, 0.35);
  }
  .backbtn { flex: none; margin-left: clamp(10px, 3vw, 40px); width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer;
    background: #fff; color: #ff2b47; font-family: var(--head); font-size: 24px; line-height: 1; box-shadow: 0 3px 0 rgba(120, 10, 20, 0.35); }
  .backbtn:not(.hidden) + h1 { padding-left: 12px; }
  .gback { display: none; }
  /* 매칭 중 표시(제목 오른쪽): 누르면 대전 화면으로 */
  .mmbadge { flex: none; display: inline-flex; align-items: center; gap: 8px; margin-left: 16px; padding: 6px 14px; border: 0; border-radius: 999px; cursor: pointer;
    background: rgba(255,255,255,0.95); color: #c4152f; font-family: var(--head); font-size: clamp(14px, 2vh, 18px); box-shadow: 0 3px 0 rgba(120,10,20,0.35); white-space: nowrap; }
  .mmbadge small { font-family: var(--font); font-size: 0.8em; color: #6d6b80; }
  .mmbadge .tm { font-variant-numeric: tabular-nums; background: #ff2b47; color: #fff; border-radius: 999px; padding: 1px 9px; font-size: 0.85em; }
  .mmbadge .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff2b47; animation: mmblink 1s infinite; }
  @keyframes mmblink { 50% { opacity: 0.2; } }
  .mmbadge i { font-style: normal; }
  @media (max-width: 760px) {
    .mmbadge small, .mmbadge i { display: none; } .mmbadge { margin-left: 8px; padding: 5px 10px; gap: 6px; font-size: 14px; }
    body:has(.mmbadge:not(.hidden)) .band-top h1 { font-size: 20px; }   /* 매칭 표시가 있으면 제목을 조금 작게 */
    .band-top { padding-right: 96px; }
  }
  .band-white {
    position: fixed; top: 0; right: 0; z-index: 4; height: calc(var(--bandH) * 0.62 + env(safe-area-inset-top, 0px)); width: 46vw;
    background: #fff; clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%);
  }
  .band-bot {
    position: fixed; right: 0; bottom: 0; z-index: 5; height: calc(var(--footH) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    width: max-content; min-width: min(64vw, 760px); max-width: 100vw; padding-left: 80px; box-sizing: border-box; background: linear-gradient(90deg, #1b5fd9, #1f74f0);   /* 안내가 늘어나면 띠도 왼쪽으로 늘어남 */
    clip-path: polygon(9% 0, 100% 0, 100% 100%, 0 100%);
    display: flex; align-items: center; justify-content: flex-end; gap: clamp(12px, 2.4vw, 30px);
    padding-right: clamp(16px, 4vw, 56px); color: #fff; font-size: clamp(14px, 2.2vh, 19px); white-space: nowrap;
  }
  .band-bot span { display: inline-flex; align-items: center; gap: 8px; }
  kbd {
    font-family: var(--font); font-size: 13px; min-width: 28px; height: 28px; padding: 0 7px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; background: #fff; color: #1b5fd9; box-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }

  /* ---------- 메뉴 ---------- */
  #menu { width: min(1320px, 96vw); display: flex; flex-direction: column; gap: 14px; height: 100%; max-height: 800px; }
  body.ingame { --bandH: clamp(44px, 7vh, 62px); --footH: clamp(36px, 6vh, 52px); }
  body.ingame .band-white { display: none; }
  body.ingame .band-top h1 { font-size: clamp(20px, 3.4vh, 32px); }
  .mwrap { position: relative; flex: 1; min-height: 0; }
  .tag {
    position: absolute; top: -26px; right: 7%; z-index: 3; background: #1aa0e8; color: #fff; font-family: var(--head);
    font-size: 15px; padding: 1px 12px; border-radius: 3px; box-shadow: 0 2px 0 rgba(0,0,0,0.2);
  }
  .screen { display: grid; gap: 18px; width: 100%; height: 100%; padding: 6px 10px; }
  #sc-main { grid-template-columns: 1.1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
  #sc-main #t-ai { grid-row: 1 / 3; }
  #sc-main #t-vs { grid-column: 2; grid-row: 1; } #sc-main #t-chars { grid-column: 3; grid-row: 1; } #sc-main #t-stats { grid-column: 2; grid-row: 2; } #sc-main #t-adv { grid-column: 3; grid-row: 2; }
  #sc-adv { grid-template-columns: repeat(3, 1fr); grid-template-rows: auto 1fr; }
  #sc-adv .seg[disabled] { opacity: 0.35; cursor: default; }
  .advst canvas { position: absolute; left: 50%; top: 9%; width: 60%; height: 46%; transform: translateX(-50%); z-index: 1; }
  .advst .tt { left: 0; right: 0; bottom: 22%; text-align: center; font-size: clamp(22px, 4vh, 38px); }
  .advst .tt small { display: block; font-size: 15px; margin-bottom: 6px; }
  .advst .rec { left: 0; right: 0; bottom: 7%; text-align: center; font-size: 22px; letter-spacing: 2px; }
  #dlg { position: fixed; left: 50%; bottom: calc(var(--footH) + 18px); transform: translateX(-50%); width: min(860px, calc(100vw - 32px)); z-index: 20;
    display: flex; gap: 14px; align-items: stretch; background: #fff; border: 4px solid #22212e; border-radius: 10px; padding: 12px; box-shadow: 0 8px 0 rgba(0,0,0,0.2); cursor: pointer; }
  #dlgFace { width: 110px; height: 110px; flex: none; background: #f1eefb; border-radius: 8px; }
  #dlg .body { flex: 1; min-width: 0; }
  #dlgName { display: inline-block; font-family: var(--head); color: #fff; border-radius: 999px; padding: 3px 14px; font-size: 18px; }
  #dlgText { font-size: clamp(17px, 2.6vh, 22px); margin: 10px 2px 0; min-height: 2.6em; line-height: 1.35; }
  #dlg .hint { position: absolute; right: 14px; bottom: 8px; font-size: 13px; color: var(--muted); }
  #sc-chars { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; }
  .charcard canvas { position: absolute; left: 50%; top: 10%; width: 64%; height: 58%; transform: translateX(-50%); z-index: 1; }
  .charcard .tt { left: 0; right: 0; bottom: 9%; text-align: center; font-size: clamp(22px, 4vh, 40px); }
  .charcard .mine { position: absolute; z-index: 2; top: 6%; right: 7%; font-family: var(--head); font-size: 14px; background: #fff; color: var(--d); border-radius: 999px; padding: 2px 10px; display: none; }
  .charcard.sel .mine { display: block; }
  .charcard.cardimg canvas { left: 5%; top: 5%; width: 90%; height: 90%; transform: none; }   /* 카드 그림(이름·소개 포함)일 때: 그림을 크게, 글자는 숨김 */
  .charcard.cardimg .tt { display: none; }
  #sc-ai { grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr 1fr; }
  #sc-vs { grid-template-columns: 1.15fr 1fr 0.9fr; grid-template-rows: auto 1fr 1fr auto; }
  #sc-vs #t-rank { grid-row: 2 / 4; grid-column: 3; }

  #sc-vs .card { grid-column: 1 / 4; }
  #sc-vs #t-quick { grid-row: 2; grid-column: 1; } #sc-vs #t-local { grid-row: 3; grid-column: 1; }
  #sc-vs #t-create { grid-row: 2; grid-column: 2; } #sc-vs #t-join { grid-row: 3; grid-column: 2; }
  #sc-solo { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  #sc-psolo { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  #sc-stats { grid-template-columns: 0.75fr 1.9fr; grid-template-rows: 1fr; }
  /* 내 정보 오른쪽: 탭 카드(요약 · 기록 · 랭크 · 순위표) */
  .infocard { display: flex; flex-direction: column; min-height: 0; padding: 12px 14px; }
  .ihead { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .itabs .seg { font-size: 17px; padding: 7px 18px; }
  .ibar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .ibar select, .ibar input { font-family: var(--font); font-size: 15px; border: 2px solid #cfd1dc; border-radius: 6px; padding: 4px 8px; background: #fff; }
  .ibody { flex: 1; min-height: 0; overflow: auto; padding-right: 4px; }
  .ibody h4 { margin: 14px 2px 8px; font-family: var(--head); font-weight: 400; font-size: 18px; color: #3a3850; }
  .ibody h4:first-child { margin-top: 2px; }
  .empty { color: var(--muted); padding: 30px 6px; text-align: center; }
  /* 기록: 경기 한 줄 */
  .mrow { display: grid; grid-template-columns: 6px 1.2fr 1.4fr 1fr 1.4fr 104px; align-items: center; gap: 12px; background: #f6f6fa; border-radius: 6px; margin-bottom: 6px; padding: 7px 10px 7px 0; min-height: 58px; }
  .mrow > .bar { align-self: stretch; border-radius: 6px 0 0 6px; background: #b7b5c8; }
  .mrow.w > .bar { background: #39c63c; } .mrow.l > .bar { background: #ff4559; } .mrow.p > .bar { background: #9a4fd8; }
  .mrow b { font-family: var(--head); font-weight: 400; font-size: 18px; display: block; }
  .mrow small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .mrow.w .mres b { color: #1a8027; } .mrow.l .mres b { color: #b01830; }
  .mvs { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .mvs canvas { width: 34px; height: 34px; flex: none; }
  .mvs span { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrank { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .mrank canvas { width: 34px; height: 34px; flex: none; }
  .mrank .up { color: #1a8027; } .mrank .down { color: #b01830; }
  .mact { display: flex; gap: 6px; justify-content: flex-end; }
  .mact button { font-family: var(--head); font-size: 16px; border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer; background: #2f78f0; color: #fff; box-shadow: 0 3px 0 #1747b0; }
  .mact button.dl { background: #6d6b80; box-shadow: 0 3px 0 #48465a; }
  .mact button.file { background: #fff; color: var(--ink); box-shadow: 0 3px 0 #cfd1dc; border: 2px solid #cfd1dc; padding: 5px 9px; }
  .mact .none { font-size: 13px; color: var(--muted); padding: 0 6px; }
  /* 랭크 */
  .rkhero { display: flex; gap: 22px; align-items: center; background: linear-gradient(135deg, #2b2450, #463a86); color: #fff; border-radius: 8px; padding: 16px 20px; }
  .rkhero canvas { width: 130px; height: 130px; flex: none; }
  .rkhero .t { font-family: var(--head); font-size: 34px; }
  .rkhero .s { opacity: 0.85; margin-top: 4px; }
  .rpbar { height: 12px; background: rgba(255,255,255,0.2); border-radius: 6px; margin-top: 10px; overflow: hidden; width: min(360px, 60vw); }
  .rpbar i { display: block; height: 100%; background: #ffe066; border-radius: 6px; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge { background: #f1eefb; border-radius: 6px; padding: 8px 12px; font-size: 14px; }
  .badge b { display: block; font-family: var(--head); font-weight: 400; font-size: 17px; }
  /* 순위표 */
  .lbhead { display: flex; align-items: center; gap: 14px; background: linear-gradient(180deg, #e8f5ff, #cfe6f7); border-radius: 8px; padding: 10px 16px; margin-bottom: 8px; }
  .lbhead canvas { width: 54px; height: 54px; }
  .lbhead .t { font-family: var(--head); font-size: 30px; color: #2c3f55; }
  .lbhead .s { margin-left: auto; text-align: right; color: #45607a; font-size: 14px; }
  .lbcols, .lbrow { display: grid; grid-template-columns: 70px 60px 90px 54px 1fr 110px; align-items: center; gap: 10px; }
  .lbcols { color: var(--muted); font-size: 13px; padding: 0 10px 4px; }
  .lbrow { background: #24384d; color: #fff; border-radius: 4px; margin-bottom: 4px; padding: 6px 10px; min-height: 58px; }
  .lbrow.first { min-height: 96px; background: linear-gradient(90deg, #2c4a66, #24384d); }
  .lbrow.me { outline: 3px solid #ffe066; }
  .lbrow .pl { font-family: var(--head); font-size: 30px; text-align: center; }
  .lbrow.first .pl { font-size: 54px; } .lbrow .star { color: #ffd23d; font-size: 18px; vertical-align: super; }
  .lbrow canvas { width: 46px; height: 46px; margin: 0; }
  .lbrow.first canvas.em { width: 64px; height: 64px; }
  .lbrow .pt { font-family: var(--head); font-size: 20px; }
  .lbrow .nm b { font-size: 19px; display: block; } .lbrow .nm small { opacity: 0.7; font-size: 13px; }
  .lbrow .wn { text-align: right; opacity: 0.9; }
  .lbfoot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .lbfoot input { flex: 1; max-width: 360px; font-family: var(--font); font-size: 15px; border: 2px solid #cfd1dc; border-radius: 6px; padding: 6px 10px; }
  .lbfoot .pg { margin-left: auto; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .lbfoot input { min-width: 0; }
  .ibar > button { font-family: var(--head); font-size: 15px; border: 2px solid #cfd1dc; background: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .ibar > button.warn { color: #b01830; }
  .mmode, .mres, .mrank > div { min-width: 0; }
  .mmode small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rkhero .note { font-size: 13px; opacity: 0.7; margin-top: 8px; }
  .badge small { font-size: 13px; color: var(--muted); }
  .lbrow small { display: block; font-size: 12px; opacity: 0.7; }
  .lbfoot button[disabled] { opacity: 0.4; cursor: default; }
  .lbfoot button { font-family: var(--head); border: 2px solid #cfd1dc; background: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; }

  .tile {
    --c: #3cc83c; --d: #1d8a2a;
    position: relative; border: 0; padding: 0; margin: 0; background: none; cursor: pointer; font: inherit; color: #fff;
    min-height: 0; min-width: 0; outline: none; text-align: left;
    filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.16));
    transition: transform 0.18s cubic-bezier(0.3, 1.6, 0.5, 1), filter 0.18s;
  }
  .tile .in, .tile .in::before { position: absolute; clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%); }
  .tile .in { inset: 0; background: var(--d); }
  .tile .in::before {
    content: ""; inset: 7px;
    background-color: var(--c);
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.24) 27%, transparent 29%),
      linear-gradient(160deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 45%, rgba(0,0,0,0.1));
    background-size: 12px 12px, 100% 100%;
  }
  .tile[data-act]:focus, .tile.sel {
    transform: scale(1.035) rotate(-1deg); z-index: 2;
    filter: drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff) drop-shadow(0 12px 14px rgba(0,0,0,0.3));
  }
  .tile:active { transform: scale(0.99); }
  .t-green  { --c: #39c63c; --d: #1a8027; }
  .t-yellow { --c: #ffc915; --d: #d08a00; }
  .t-purple { --c: #9a4fd8; --d: #5e2399; }
  .t-blue   { --c: #2f78f0; --d: #1747b0; }
  .t-orange { --c: #ff8a1c; --d: #c75a00; }

                 3px 3px 0 var(--d), -3px 3px 0 var(--d), 3px -3px 0 var(--d), -3px -3px 0 var(--d), 0 8px 0 rgba(0,0,0,0.22);

  /* 내 정보 */

  .profile label { font-size: 15px; opacity: 0.9; }

  .big-chips { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }

  .chip small { display: block; font-size: 12px; opacity: 0.9; margin-top: 2px; }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .chip { border-radius: 6px; padding: 8px 12px; color: #fff; background: var(--c); box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18); }
  .chip span { display: block; font-size: 13px; opacity: 0.92; }

  .empty { color: var(--muted); padding: 10px 0; }

  /* 탭(타일) 안에 표시되는 설명 */

  /* 세로가 아주 짧은 화면의 대전 메뉴는 칸이 좁아서 설명을 아래 바에 표시 */
  @media (max-height: 660px) { #sc-vs .td { display: none; } }
  .mdesc:empty { visibility: hidden; }
  .mdesc {
    background: #fff; border: 3px solid #cfd1dc; border-radius: 4px; padding: 10px 20px; font-size: clamp(15px, 2.3vh, 19px);
    min-height: 48px; width: min(760px, 100%); box-shadow: 0 4px 0 rgba(0,0,0,0.06);

  /* ---------- 게임 화면 ---------- */
  #stage { position: relative; line-height: 0; }
  canvas#cv { display: block; }
  /* 일시정지·결과 창: 게임 화면이 작아도(짧은 폰 · 가로) 잘리지 않게 위쪽 띠 아래 화면 전체에, 넘치면 스크롤 */
  #overlay {
    position: fixed; left: 0; right: 0; bottom: 0; top: calc(var(--bandH) + env(safe-area-inset-top, 0px)); z-index: 5;
    display: flex; align-items: flex-start; justify-content: center; line-height: 1.35; overflow-y: auto;
    background: rgba(26, 20, 60, 0.55); padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .result { position: relative; margin: auto; width: min(500px, 100%); padding: 34px 34px 30px; color: #fff; text-align: center; }
  .result .in, .result .in::before { position: absolute; clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%); }
  .result .in { inset: 0; background: var(--d); }
  .result .in::before {
    content: ""; inset: 8px; background-color: var(--c);
    background-image: radial-gradient(circle, rgba(255,255,255,0.24) 27%, transparent 29%); background-size: 12px 12px;
  }
  .result > *:not(.in) { position: relative; }
  .result h2 { position: relative; margin: 0 0 6px; font-size: clamp(26px, min(7vh, 8vw), 64px); word-break: keep-all; overflow-wrap: anywhere; }
  .result p { margin: 0 0 14px; font-size: 18px; word-break: keep-all; }
  .result .chips { grid-template-columns: repeat(2, 1fr); margin-bottom: 18px; text-align: left; }
  .result .chip { background: rgba(0,0,0,0.24); box-shadow: none; word-break: keep-all; }   /* '플레이 시간' · '4명'이 글자 중간에서 줄바꿈되지 않게 */
  .result .chip b { font-size: clamp(16px, 4.6vw, 21px); }
  .result .btn { white-space: nowrap; }
  /* 짧은 화면(작은 폰 · 가로): 결과 창을 작게 */
  @media (max-height: 700px), (max-width: 380px) {
    .result { padding: 20px 20px 18px; }
    .result p { font-size: 15px; margin-bottom: 8px; }
    .result .chips { gap: 6px; margin-bottom: 12px; }
    .result .chip { padding: 5px 10px; }
    .result .btn { font-size: 18px; padding: 8px 16px; }
  }
  @media (max-height: 500px) and (orientation: landscape) {
    .result { width: min(640px, 100%); }
    .result .chips { grid-template-columns: repeat(4, 1fr); }
    .result h2 { font-size: 32px; }
  }
  /* 랭크전 결과: 내 티어·RP 변화 vs 상대 티어 */
  .rkres { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; background: rgba(0,0,0,0.28); border-radius: 8px; padding: 12px 14px; margin: -4px 0 14px; text-align: left; }
  .rkres .side { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .rkres .side.op { flex-direction: row-reverse; text-align: right; }
  .rkres canvas { width: 62px; height: 62px; flex: none; }
  .rkres .op canvas { width: 46px; height: 46px; margin: 0; }
  .rkres b { display: block; font-family: var(--head); font-weight: 400; font-size: 30px; line-height: 1.1; white-space: nowrap; }
  .rkres b.pl { font-size: 24px; }
  .rkres .op b { font-size: 18px; }
  .rkres small { display: block; font-size: 13px; opacity: 0.9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rkres .vs { font-family: var(--head); opacity: 0.7; }
  .rkres .up { color: #b6ff9e; } .rkres .down { color: #ffd0d6; }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    font-family: var(--head); font-size: 22px; border: 0; border-radius: 8px; padding: 10px 24px; cursor: pointer;
    background: #fff; color: var(--d); box-shadow: 0 5px 0 rgba(0,0,0,0.25);
  }
  .btn.ghost { background: rgba(255,255,255,0.2); color: #fff; box-shadow: inset 0 0 0 3px rgba(255,255,255,0.75); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* 터치 버튼 8개가 좁은 폰 화면(양옆 8px 여백)에도 한 줄로 들어가게 크기를 화면 폭에 맞춤 */
  .pad { --pg: clamp(4px, 1.6vw, 10px); --pb: min(58px, calc((100vw - 16px - 7 * var(--pg)) / 8));
    display: none; gap: var(--pg); margin: 12px auto 0; align-items: center; justify-content: center; max-width: 100%; }   /* 가운데 정렬 */
  .pad button {
    font-family: var(--font); font-size: calc(var(--pb) * 0.42); color: #fff; width: var(--pb); height: var(--pb); padding: 0; flex: none; border-radius: 50%;
    background: #2f78f0; border: 0; box-shadow: 0 5px 0 #1747b0; touch-action: none;
  }
  .pad button.on { transform: translateY(3px); box-shadow: 0 2px 0 #1747b0; }

  @media (pointer: coarse), (max-width: 760px) { #game .pad { display: flex; } }
  #game .pad2 { display: none !important; margin: 0 auto 12px; transform: rotate(180deg); }
  #game .pad2 button { background: #e8283c; box-shadow: 0 5px 0 #9c1426; }
  @media (pointer: coarse) { body.local2 #game .pad2 { display: flex !important; } }   /* 로컬 대전 2P 버튼(맞은편에서 누르게 거꾸로) */
  body.replay #pad [data-k=down], body.replay #pad [data-k=hard], body.replay #pad [data-k=ccw], body.replay #pad [data-k=cw], body.replay #pad [data-k=hold] { visibility: hidden; }   /* 다시 보기: ◀ ▶ 배속 · Ⅱ만 */
  @media (pointer: coarse) { #hints { visibility: hidden; } }      /* 터치 기기: 키보드 안내는 숨김 */
  body.ingame { overflow: hidden !important; overscroll-behavior: none; }   /* 게임 중 화면이 밀리거나 당겨서 새로고침되지 않게 */
  body.ingame #cv, .pad { touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .pad button { -webkit-touch-callout: none; }
  /* 세로 폰: 터치 버튼을 크게 두 줄로 */
  @media (max-width: 1100px) and (orientation: portrait) {   /* 세로 폰 · 태블릿 */
    .pad { --pb: min(72px, calc((100vw - 16px - 3 * var(--pg)) / 4)); flex-wrap: wrap; max-width: calc(4 * var(--pb) + 3 * var(--pg) + 4px); }
  }
  @media (max-width: 760px) {
    body { justify-content: flex-start; overflow-y: auto; }
    #menu { height: auto; max-height: none; }
    .screen { grid-template-columns: 1fr !important; grid-template-rows: none !important; grid-auto-rows: minmax(140px, auto); }
    .screen > * { grid-row: auto !important; grid-column: auto !important; }
    .band-white { display: none; }
    .band-bot { width: 100vw; min-width: 0; padding-left: 16px; padding-right: 16px; clip-path: none; justify-content: center; }
    #t-profile { min-height: 330px; }
    .infocard { min-height: 70vh; }
    .lbcols { display: none; }
    .lbrow { grid-template-columns: 40px 46px 64px 1fr 46px; gap: 6px; }
    .lbrow > :nth-child(4) { display: none; }
    .lbrow.first .pl { font-size: 36px; } .lbrow.first canvas.em { width: 46px; height: 46px; margin: 0; }

    .tile .td { display: none; }                 /* 좁은 화면: 타일 설명은 아래 설명 칸(#mDesc)에서만 */
    #t-join .joinrow { right: 34%; }              /* 좁은 화면: 코드 칸·참가 버튼이 오른쪽 그림(뿌요)을 가리지 않게 */
    /* 메인 메뉴 타일(폰): 제목은 왼쪽 가운데, 그림은 오른쪽 절반, 작은 뿌요 아이콘은 숨김(서로 겹치지 않게) */
    #sc-main .tile { min-height: 170px; }

    #sc-main .tile .tt { left: 7% !important; right: auto !important; top: 50% !important; bottom: auto !important; transform: translateY(-50%); text-align: left; font-size: clamp(30px, 9vw, 40px); max-width: 44%; }
    #sc-main .tile .ico { display: none; }
    #sc-main .tile .rec { left: 7% !important; right: auto !important; top: auto !important; bottom: 9% !important; font-size: 13px; padding: 2px 10px; }
    /* 캐릭터 고르기(폰): 두 줄씩 정사각 카드 */
    #sc-chars { grid-template-columns: 1fr 1fr !important; grid-auto-rows: auto !important; }
    #sc-chars .tile { aspect-ratio: 300 / 354; min-height: 0; }
    #sc-chars .charcard .mine { font-size: 11px; padding: 1px 7px; top: 7%; right: 8%; }
    /* 어드벤처 스테이지(폰): 키를 키워 얼굴 그림 아래에 스테이지 이름·별이 오게 */
    #sc-adv .advst { min-height: 250px; }

    #sc-adv .advst .tt { bottom: 19%; font-size: 26px; }
    #sc-adv .advst .tt small { font-size: 13px; margin-bottom: 2px; }
    #sc-adv .advst .rec { bottom: 5%; font-size: 18px; }
    body.ingame #hints { visibility: hidden; }  /* 게임 중 키보드 안내는 폰에서 숨김(터치 버튼을 씀) */
    .tag { display: none; }
  }
  /* 가로 폰(낮은 화면): 위아래 띠를 숨기고, 터치 버튼은 화면 양옆 아래에 둘로 나눠 게임 화면을 크게 */
  @media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
    body.ingame { padding: calc(6px + env(safe-area-inset-top, 0px)) 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
    body.ingame .band-top, body.ingame .band-white, body.ingame #hints { display: none; }
    body.ingame #overlay { top: 0; }
    body.ingame #gBack { display: block; position: fixed; z-index: 6; left: max(10px, env(safe-area-inset-left, 0px)); top: calc(8px + env(safe-area-inset-top, 0px)); width: 46px; height: 46px; margin: 0; }
    #game .pad { --pb: min(60px, 15vh); position: fixed; z-index: 4; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); margin: 0; max-width: none;
      display: grid; grid-template-columns: repeat(2, var(--pb)) 1fr repeat(2, var(--pb)); grid-template-rows: repeat(2, var(--pb));
      padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); pointer-events: none; }

<style id="updCss">
#updBar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9999;max-width:min(92vw,520px);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;padding:10px 14px;border-radius:12px;background:#1f2a44;color:#fff;border:1px solid #5b7cff;box-shadow:0 6px 24px rgba(0,0,0,.4);font-size:14px}
#updBar.hidden{display:none}
#splash{position:fixed;inset:0;z-index:10000;overflow:hidden;color:#fff;transition:opacity .45s;
  background:radial-gradient(ellipse at 50% 35%,#4a2a9a 0%,#2a1766 45%,#150c3a 100%)}
#splash::before{content:"";position:absolute;inset:-50%;background:repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 26px,transparent 26px 70px);animation:spstripe 14s linear infinite}
@keyframes spstripe{to{transform:translateX(140px)}}
#splash.out{opacity:0;pointer-events:none}
#splash .sp-blobs{position:absolute;inset:0;pointer-events:none}
#splash .pb{position:absolute;left:var(--x);bottom:-80px;width:var(--s);height:calc(var(--s)*.92);border-radius:50% 50% 46% 46%;
  background:radial-gradient(circle at 35% 28%,#fff9 0 9%,transparent 10%),radial-gradient(circle at 50% 40%,var(--c1),var(--c2));box-shadow:inset 0 -5px 0 #0003,0 6px 0 #0002;
  animation:sprise var(--d) linear infinite;animation-delay:calc(var(--w)*-1)}
#splash .pb::before,#splash .pb::after{content:"";position:absolute;top:38%;width:22%;height:26%;border-radius:50%;background:radial-gradient(circle at 60% 60%,#222 0 35%,#fff 38%)}
#splash .pb::before{left:22%}#splash .pb::after{right:22%}
@keyframes sprise{0%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-60vh) rotate(6deg)}100%{transform:translateY(-125vh) rotate(-6deg)}}
#splash .sp-main{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:0 16px}
#splash .sp-logo{display:flex;gap:2px;font-family:'Black Han Sans',sans-serif;font-size:clamp(56px,11vw,104px);line-height:1}
#splash .sp-logo span{display:inline-block;color:#fff;-webkit-text-stroke:8px #5a1ea8;paint-order:stroke fill;text-shadow:0 7px 0 #2a0f5e,0 14px 22px #0008;animation:spbounce 1.6s ease-in-out infinite}
#splash .sp-logo span:nth-child(1){color:#ff6b7f;animation-delay:0s}#splash .sp-logo span:nth-child(2){color:#ffe36a;animation-delay:.12s}
#splash .sp-logo span:nth-child(3){color:#6ee28d;animation-delay:.24s}#splash .sp-logo span:nth-child(4){color:#7fb6ff;animation-delay:.36s}
@keyframes spbounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
#splash .sp-mas{display:flex;gap:6px}
#splash .sp-mas i{width:clamp(34px,6vw,58px);aspect-ratio:1;background:url(img/chars_icon.webp) calc(var(--n)*14.2857%) 0/800% 100% no-repeat;animation:spjump 1.4s ease-in-out infinite;animation-delay:calc(var(--n)*.1s);filter:drop-shadow(0 4px 0 #0005)}
@keyframes spjump{0%,60%,100%{transform:translateY(0) scale(1,1)}25%{transform:translateY(-12px) scale(.94,1.06)}45%{transform:translateY(0) scale(1.08,.92)}}
#splash .sp-barwrap{display:flex;align-items:center;gap:12px;width:min(78vw,460px)}
#splash .sp-bar{flex:1;height:18px;border-radius:99px;background:#0006;border:3px solid #fff;box-shadow:0 4px 0 #0004;overflow:hidden}
#splash .sp-bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .5s ease-out;
  background:repeating-linear-gradient(135deg,#ffd23f 0 12px,#ff8a3d 12px 24px);background-size:34px 100%;animation:spbar .8s linear infinite}
@keyframes spbar{to{background-position:34px 0}}
#splash #spPct{min-width:44px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #0006}
#splash #spMsg{font-size:17px;text-shadow:0 2px 0 #0006;min-height:1.4em}
#splash #spAsk{display:flex;gap:10px}#splash #spAsk.hidden{display:none}
#splash button{border:0;border-radius:12px;padding:9px 18px;font:inherit;font-weight:700;cursor:pointer;background:#ffd23f;color:#5a1ea8;box-shadow:0 4px 0 #b88a00}
#splash button.sub{background:transparent;color:#fff;border:2px solid #fff;box-shadow:none}
#splash #spTip{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:14px;opacity:.85;text-shadow:0 1px 2px #0008;padding:0 16px}
#splash #spVer{position:absolute;right:16px;bottom:12px;font-size:12px;opacity:.7}
@media (prefers-reduced-motion:reduce){#splash *,#splash::before{animation:none !important}}
#gameWait{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:9998;display:flex;gap:8px;align-items:center;padding:6px 14px;border-radius:999px;background:rgba(31,42,68,.92);color:#fff;font-size:14px;border:1px solid #5b7cff;pointer-events:none;white-space:nowrap}
#gameWait.hidden{display:none}
#gameWait .dot{width:9px;height:9px;border-radius:50%;background:#ff2b47;animation:mmblink 1s infinite}
#gameWait b{background:#ff2b47;border-radius:999px;padding:1px 9px;font-variant-numeric:tabular-nums}
#gameWait small{opacity:.75}
body.app label.setchk:has(#vib),body.app #lanInfo{display:none !important}
#updBar button{border:0;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer;background:#5b7cff;color:#fff}
#updBar button.sub{background:transparent;border:1px solid #8aa0ff}
</style>
<div id="gameWait" class="hidden" role="status"></div>
<div id="updBar" class="hidden" role="status"><span id="updMsg"></span><button id="updGo"></button><button id="updLater" class="sub">나중에</button></div>
</body>
</html>
