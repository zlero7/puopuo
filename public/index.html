<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뿌요뿌요</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --font: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --head: "Black Han Sans", "Jua", "Malgun Gothic", sans-serif;
    --ink: #22212e; --muted: #6d6b80;
    --bandH: clamp(58px, 10vh, 92px); --footH: clamp(46px, 8vh, 70px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--ink); font-family: var(--font);
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.55) 0 3px, transparent 3px 28px),
      linear-gradient(180deg, #eef0f5, #d9dbe5);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(var(--bandH) + 10px + env(safe-area-inset-top, 0px)) 8px calc(var(--footH) + 6px + env(safe-area-inset-bottom, 0px));
    overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .hidden { display: none !important; }
  .gear { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); right: 14px; z-index: 6; font-family: var(--head); font-size: 16px;
    border: 0; border-radius: 999px; padding: 6px 14px; background: #2f78f0; color: #fff; cursor: pointer; box-shadow: 0 3px 0 #1747b0; }
  .modal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(26,20,60,0.5); padding: 16px; }
  .setcard { width: min(560px, 100%); max-height: 90vh; }
  .setcard h3 small { font-family: var(--font); font-size: 13px; color: var(--muted); }
  .setrow { display: grid; grid-template-columns: 90px 1fr 48px; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 16px; }
  .keylist { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 8px; align-items: center; font-size: 15px; margin-bottom: 8px; }
  .keylist button { font-family: var(--font); font-size: 14px; min-width: 110px; padding: 5px 8px; border: 2px solid #cfd1dc; border-radius: 6px; background: #f6f6fa; cursor: pointer; }
  .keylist button.wait { border-color: #2f78f0; background: #e6efff; }
  .padinfo { font-size: 14px; color: var(--muted); margin: 6px 0 10px; }
  .stylebar {
    grid-column: 1 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; background: #fff;
    border: 3px solid #cfd1dc; border-radius: 6px; padding: 7px 14px; box-shadow: 0 4px 0 rgba(0,0,0,0.06);
  }
  .stylebar .lab { font-family: var(--head); font-size: 17px; color: #3a3850; }
  .segs { display: flex; background: #e9eaf1; border-radius: 999px; padding: 3px; }
  .seg { font-family: var(--head); font-size: 16px; border: 0; background: transparent; color: #6d6b80; padding: 6px 16px; border-radius: 999px; cursor: pointer; }
  .seg.on { background: var(--c); color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,0.2); }
  .seg:focus-visible, .seg:focus { outline: 3px solid #1f74f0; outline-offset: 1px; }

  /* ---------- 위·아래 사선 띠 ---------- */
  .band-top {
    position: fixed; left: 0; top: 0; z-index: 5; height: calc(var(--bandH) + env(safe-area-inset-top, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    width: min(62vw, 720px); background: linear-gradient(90deg, #ff2b47, #ff6a1f 70%, #ff8f1f);
    clip-path: polygon(0 0, 100% 0, 86% 100%, 0 100%); display: flex; align-items: center;
  }
  .band-top h1 {
    margin: 0; padding-left: clamp(18px, 5vw, 64px); font-family: var(--head); font-weight: 400;
    font-size: clamp(24px, 4.4vh, 42px); color: #fff; letter-spacing: 1px; text-shadow: 0 3px 0 rgba(120, 10, 20, 0.35);
  }
  .band-white {
    position: fixed; top: 0; right: 0; z-index: 4; height: calc(var(--bandH) * 0.62 + env(safe-area-inset-top, 0px)); width: 46vw;
    background: #fff; clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%);
  }
  .band-bot {
    position: fixed; right: 0; bottom: 0; z-index: 5; height: calc(var(--footH) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    width: min(64vw, 760px); background: linear-gradient(90deg, #1b5fd9, #1f74f0);
    clip-path: polygon(9% 0, 100% 0, 100% 100%, 0 100%);
    display: flex; align-items: center; justify-content: flex-end; gap: clamp(12px, 2.4vw, 30px);
    padding-right: clamp(16px, 4vw, 56px); color: #fff; font-size: clamp(14px, 2.2vh, 19px); white-space: nowrap;
  }
  .band-bot span { display: inline-flex; align-items: center; gap: 8px; }
  kbd {
    font-family: var(--font); font-size: 13px; min-width: 28px; height: 28px; padding: 0 7px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; background: #fff; color: #1b5fd9; box-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }

  /* ---------- 메뉴 ---------- */
  #menu { width: min(1320px, 96vw); display: flex; flex-direction: column; gap: 14px; height: 100%; max-height: 800px; }
  body.ingame { --bandH: clamp(44px, 7vh, 62px); --footH: clamp(36px, 6vh, 52px); }
  body.ingame .band-white { display: none; }
  body.ingame .band-top h1 { font-size: clamp(20px, 3.4vh, 32px); }
  .mwrap { position: relative; flex: 1; min-height: 0; }
  .tag {
    position: absolute; top: -26px; right: 7%; z-index: 3; background: #1aa0e8; color: #fff; font-family: var(--head);
    font-size: 15px; padding: 1px 12px; border-radius: 3px; box-shadow: 0 2px 0 rgba(0,0,0,0.2);
  }
  .screen { display: grid; gap: 18px; width: 100%; height: 100%; padding: 6px 10px; }
  #sc-main { grid-template-columns: 1fr 1.3fr; grid-template-rows: 1fr 1fr; }
  #sc-main #t-ai { grid-row: 1 / 3; }
  #sc-ai { grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr 1fr; }
  #sc-vs { grid-template-columns: 1.15fr 1fr; grid-template-rows: auto 1fr 1fr auto; }

  #sc-vs .card { grid-column: 1 / 3; }
  #sc-vs #t-quick { grid-row: 2; grid-column: 1; } #sc-vs #t-local { grid-row: 3; grid-column: 1; }
  #sc-vs #t-create { grid-row: 2; grid-column: 2; } #sc-vs #t-join { grid-row: 3; grid-column: 2; }
  #sc-solo { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  #sc-stats { grid-template-columns: 0.9fr 1.6fr; grid-template-rows: auto 1fr; }
  #sc-stats #t-profile { grid-row: 1 / 3; }

  .tile {
    --c: #3cc83c; --d: #1d8a2a;
    position: relative; border: 0; padding: 0; margin: 0; background: none; cursor: pointer; font: inherit; color: #fff;
    min-height: 0; min-width: 0; outline: none; text-align: left;
    filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.16));
    transition: transform 0.18s cubic-bezier(0.3, 1.6, 0.5, 1), filter 0.18s;
  }
  .tile .in, .tile .in::before { position: absolute; clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%); }
  .tile .in { inset: 0; background: var(--d); }
  .tile .in::before {
    content: ""; inset: 7px;
    background-color: var(--c);
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.24) 27%, transparent 29%),
      linear-gradient(160deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 45%, rgba(0,0,0,0.1));
    background-size: 12px 12px, 100% 100%;
  }
  .tile[data-act]:focus, .tile.sel {
    transform: scale(1.035) rotate(-1deg); z-index: 2;
    filter: drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff) drop-shadow(0 12px 14px rgba(0,0,0,0.3));
  }
  .tile:active { transform: scale(0.99); }
  .t-green  { --c: #39c63c; --d: #1a8027; }
  .t-yellow { --c: #ffc915; --d: #d08a00; }
  .t-purple { --c: #9a4fd8; --d: #5e2399; }
  .t-blue   { --c: #2f78f0; --d: #1747b0; }
  .t-orange { --c: #ff8a1c; --d: #c75a00; }
  .t-red    { --c: #ff4559; --d: #b01830; }

  .tt {
    position: absolute; z-index: 2; font-family: var(--head); font-weight: 400; line-height: 1; white-space: nowrap;
    font-size: clamp(28px, 6vh, 64px); color: #fff;
    text-shadow: 4px 0 0 var(--d), -4px 0 0 var(--d), 0 4px 0 var(--d), 0 -4px 0 var(--d),
                 3px 3px 0 var(--d), -3px 3px 0 var(--d), 3px -3px 0 var(--d), -3px -3px 0 var(--d), 0 8px 0 rgba(0,0,0,0.22);
  }
  .tt small { display: block; font-size: 0.42em; margin-bottom: 6px; }
  .art {
    position: absolute; z-index: 1; border: 5px solid #fff; border-radius: 3px; background: #1e174e;
    transform: rotate(-2deg); box-shadow: 0 5px 0 rgba(0,0,0,0.2);
  }
  .ico { position: absolute; z-index: 3; width: clamp(64px, 12vh, 104px); height: clamp(64px, 12vh, 104px); pointer-events: none; }
  .tile[data-act]:focus .ico { animation: bob 0.9s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0) scale(1, 1); } 45% { transform: translateY(-8px) scale(0.96, 1.05); } 80% { transform: translateY(0) scale(1.08, 0.92); } }
  .rec {
    position: absolute; z-index: 3; right: 7%; bottom: 13%; background: rgba(0,0,0,0.26); border-radius: 999px;
    padding: 4px 14px; font-size: clamp(14px, 2.2vh, 19px);
  }
  .tile .note { position: absolute; z-index: 3; left: 9%; bottom: 14%; font-size: clamp(14px, 2.2vh, 18px); opacity: 0.95; }

  /* 방 참가 입력 */
  .joinrow { position: absolute; z-index: 3; left: 9%; right: 8%; bottom: 14%; display: flex; gap: 8px; }
  .joinrow input {
    flex: 1; min-width: 0; font-family: var(--head); font-size: 22px; letter-spacing: 6px; text-align: center; text-transform: uppercase;
    border: 0; border-radius: 6px; padding: 6px 8px; color: var(--ink); box-shadow: inset 0 3px 0 rgba(0,0,0,0.12);
  }
  .mini {
    font-family: var(--head); font-size: 18px; border: 0; border-radius: 6px; padding: 6px 16px; cursor: pointer;
    background: #fff; color: var(--d, #1747b0); box-shadow: 0 4px 0 rgba(0,0,0,0.2);
  }
  .mini:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }

  /* 흰 카드 */
  .card {
    position: relative; background: #fff; border: 3px solid #cfd1dc; border-radius: 6px; padding: 12px 18px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.08); color: var(--ink); min-height: 0; overflow: auto;
  }
  .card h3 { margin: 0 0 8px; font-family: var(--head); font-weight: 400; font-size: 20px; color: #3a3850; }
  .netrow { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 16px; }
  .netrow input { font-family: var(--font); font-size: 15px; border: 2px solid #cfd1dc; border-radius: 6px; padding: 4px 8px; width: 210px; }
  .status { color: #d4570a; min-height: 20px; }
  .roomcode { font-family: var(--head); font-size: 34px; letter-spacing: 8px; color: #ff6a1f; }
  .lan { color: var(--muted); user-select: text; -webkit-user-select: text; }
  .lan b { color: var(--ink); font-weight: 400; }
  .ghostbtn { font-family: var(--font); font-size: 15px; border: 2px solid #cfd1dc; background: #fff; border-radius: 6px; padding: 4px 12px; cursor: pointer; color: var(--ink); }

  /* 내 정보 */
  .profile { position: absolute; z-index: 3; inset: 12% 10% 10% 11%; display: flex; flex-direction: column; gap: 10px; }
  .profile label { font-size: 15px; opacity: 0.9; }
  .profile input {
    font-family: var(--head); font-size: 26px; border: 0; border-radius: 6px; padding: 6px 10px; width: 100%; color: var(--ink);
    box-shadow: inset 0 3px 0 rgba(0,0,0,0.12);
  }
  .big { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .big div { background: rgba(0,0,0,0.22); border-radius: 8px; padding: 8px 12px; }
  .big b { display: block; white-space: nowrap; font-family: var(--head); font-weight: 400; font-size: clamp(20px, 3.4vh, 30px); }
  .big span { font-size: 14px; opacity: 0.9; }
  .rhead { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 10px; }
  .rhead h3 { margin: 0; }
  .rtabs .seg { font-size: 15px; padding: 5px 13px; }
  .big-chips { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .big-chips .chip { padding: 12px 14px; }
  .big-chips .chip b { font-size: 26px; }
  .chip small { display: block; font-size: 12px; opacity: 0.9; margin-top: 2px; }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .chip { border-radius: 6px; padding: 8px 12px; color: #fff; background: var(--c); box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18); }
  .chip span { display: block; font-size: 13px; opacity: 0.92; }
  .chip b { font-family: var(--head); font-weight: 400; font-size: 21px; }
  .hist { width: 100%; border-collapse: collapse; font-size: 15px; }
  .hist td { padding: 6px 6px; border-bottom: 1px dashed #dfe0e8; white-space: nowrap; }
  .hist td:first-child { color: var(--muted); }
  .res { display: inline-block; min-width: 44px; text-align: center; border-radius: 999px; padding: 1px 10px; color: #fff; }
  .res.w { background: #f2a900; } .res.l { background: #2f78f0; } .res.p { background: #2fb043; }
  .empty { color: var(--muted); padding: 10px 0; }
  .reset { position: absolute; top: 10px; right: 14px; }


  /* 탭(타일) 안에 표시되는 설명 */
  .td {
    position: absolute; z-index: 3; left: 8%; right: 8%; bottom: 6%; padding: 4px 10px; border-radius: 6px;
    background: rgba(0,0,0,0.26); color: #fff; font-size: clamp(12px, 1.9vh, 16px); line-height: 1.3;
    pointer-events: none; text-align: left; word-break: keep-all; text-shadow: 0 1px 0 rgba(0,0,0,0.25);
  }
  #t-ai .td { left: 24%; right: 6%; bottom: 5%; font-size: clamp(13px, 2.1vh, 18px); }
  #t-ai .tt { bottom: 20% !important; }
  #t-vs .td { left: 7%; right: 7%; bottom: 5%; }
  #t-vs .art { height: 55% !important; }
  #t-vs .tt { bottom: 26% !important; }
  #t-stats .td { left: 7%; right: 7%; bottom: 5%; }
  #t-stats .art { height: 54% !important; }
  #t-stats .tt { bottom: 46% !important; }
  #t-stats .rec { bottom: 28% !important; }
  #sc-ai .tile:not(#t-ai) .tt { top: 8% !important; }
  #sc-ai .tile:not(#t-ai) .td { left: 46%; right: 5%; bottom: auto; top: 38%; }
  #sc-ai .tile:not(#t-ai) .rec { bottom: 7% !important; }
  #t-quick .td { left: 8%; right: 8%; bottom: 7%; }
  #t-quick .art { top: 8% !important; height: 50% !important; }
  #t-quick .tt { bottom: 34% !important; }
  #t-quick .rec { top: 10% !important; }
  #t-create .td, #t-local .td { bottom: 7%; }
  #t-create .tt { top: 12% !important; }
  #t-local .td { right: 20%; }
  #t-local .tt { top: 6% !important; }
  #t-join .tt { top: 2% !important; font-size: clamp(22px, 4.4vh, 44px); }
  #t-join .joinrow { bottom: 29%; }
  #t-join .joinrow input { padding: 3px 8px; }
  #t-join .mini { padding: 3px 14px; }
  #t-join .td { bottom: 6%; }
  #sc-solo .td { top: 52%; bottom: auto; left: 10%; right: 8%; }

  /* 세로가 아주 짧은 화면의 대전 메뉴는 칸이 좁아서 설명을 아래 바에 표시 */
  @media (max-height: 660px) { #sc-vs .td { display: none; } }
  .mdesc:empty { visibility: hidden; }
  .mdesc {
    background: #fff; border: 3px solid #cfd1dc; border-radius: 4px; padding: 10px 20px; font-size: clamp(15px, 2.3vh, 19px);
    min-height: 48px; width: min(760px, 100%); box-shadow: 0 4px 0 rgba(0,0,0,0.06);
  }

  /* ---------- 게임 화면 ---------- */
  #stage { position: relative; line-height: 0; }
  canvas#cv { display: block; }
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; line-height: 1.35;
    background: rgba(26, 20, 60, 0.55); border-radius: 16px; padding: 16px;
  }
  .result { position: relative; width: min(500px, 92%); padding: 34px 34px 30px; color: #fff; text-align: center; }
  .result .in, .result .in::before { position: absolute; clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%); }
  .result .in { inset: 0; background: var(--d); }
  .result .in::before {
    content: ""; inset: 8px; background-color: var(--c);
    background-image: radial-gradient(circle, rgba(255,255,255,0.24) 27%, transparent 29%); background-size: 12px 12px;
  }
  .result > *:not(.in) { position: relative; }
  .result h2 { position: relative; margin: 0 0 6px; font-size: clamp(40px, 7vh, 64px); }
  .result p { margin: 0 0 14px; font-size: 18px; }
  .result .chips { grid-template-columns: repeat(2, 1fr); margin-bottom: 18px; text-align: left; }
  .result .chip { background: rgba(0,0,0,0.24); box-shadow: none; }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    font-family: var(--head); font-size: 22px; border: 0; border-radius: 8px; padding: 10px 24px; cursor: pointer;
    background: #fff; color: var(--d); box-shadow: 0 5px 0 rgba(0,0,0,0.25);
  }
  .btn.ghost { background: rgba(255,255,255,0.2); color: #fff; box-shadow: inset 0 0 0 3px rgba(255,255,255,0.75); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  .pad { display: none; gap: 10px; margin-top: 12px; align-items: center; justify-content: center; }
  .pad button {
    font-family: var(--font); font-size: 24px; color: #fff; width: 58px; height: 58px; border-radius: 50%;
    background: #2f78f0; border: 0; box-shadow: 0 5px 0 #1747b0; touch-action: none;
  }
  .pad button.on { transform: translateY(3px); box-shadow: 0 2px 0 #1747b0; }

  @media (pointer: coarse), (max-width: 760px) { #game .pad { display: flex; } }
  @media (max-width: 760px) {
    body { justify-content: flex-start; overflow-y: auto; }
    #menu { height: auto; max-height: none; }
    .screen { grid-template-columns: 1fr !important; grid-template-rows: none !important; grid-auto-rows: minmax(140px, auto); }
    .screen > * { grid-row: auto !important; grid-column: auto !important; }
    .band-white { display: none; }
    .band-bot { width: 100vw; clip-path: none; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) { .tile, .tile[data-act]:focus .ico { transition: none; animation: none; } }
</style>
</head>
<body>
  <div class="band-top"><h1 id="bandTitle">메인 메뉴</h1></div>
  <div class="band-white"></div>
  <button id="bSettings" class="gear" aria-label="설정">⚙ 설정</button>
  <div id="settings" class="modal hidden" role="dialog" aria-label="설정">
    <div class="card setcard">
      <h3>설정</h3>
      <div class="setrow"><label for="vBgm">배경음악</label><input type="range" id="vBgm" min="0" max="1" step="0.05"><span id="vBgmV"></span></div>
      <div class="setrow"><label for="vSfx">효과음</label><input type="range" id="vSfx" min="0" max="1" step="0.05"><span id="vSfxV"></span></div>
      <h3>키 설정 <small>(칸을 누르고 원하는 키를 누르세요 · Delete로 비우기)</small></h3>
      <div id="keyList" class="keylist"></div>
      <p class="padinfo" id="padInfo"></p>
      <div class="btns"><button class="ghostbtn" id="bKeyReset">기본값으로</button><button class="mini" id="bSetClose" style="--d:#1747b0">닫기</button></div>
    </div>
  </div>
  <div class="band-bot" id="hints"></div>

  <!-- ================= 메뉴 ================= -->
  <div id="menu">
    <div class="mwrap">
      <div class="tag">1P</div>

      <section id="sc-main" class="screen">
        <button class="tile t-green" id="t-ai" data-act="go:ai" data-desc="CPU와 겨루는 모드야. 혼자 연습하는 것도 여기서 할 수 있어.">
          <span class="in"></span>
          <canvas class="art" data-art="ai" style="left:12%;top:9%;width:74%;height:52%"></canvas>
          <span class="tt" style="left:24%;bottom:14%">AI 대전</span>

    this.acBonus = false; this.blockedAt = 0; this.dangerOn = false; this.holdP = null; this.canHold = true;
    this.pops = 0; this.level = 1; this.phase = 'none'; this.piece = null; this.acc = 0; this.settleT = 0;
    this.particles = []; this.texts = []; this.trails = []; this.shake = 0; this.flash = 0;
    this.dead = false; this.won = false; this.noGarb = false; this.soft = false;
    this.queue = []; this.net = null; this.lastLockN = 0;
    this.lastDir = 0; this.das = 0; this.rep = 0; this.aiT = 0; this.tgt = null;
    this.popList = []; this.popT = 0;
  }

  mk(c, r, col, y) { return { c, r, col, y, vy: 0, sq: -1, amp: 0 }; }
  valid(x, y) { return x >= 0 && x < COLS && y >= 0 && y < ROWS && !this.grid[y][x]; }
  fits(p) { return this.valid(p.x, p.y) && this.valid(p.x + DX[p.o], p.y + DY[p.o]); }
  fallIv() { return game.vs ? 480 : Math.max(120, 700 - (this.level - 1) * 60); }

  spawn() {
    if (this.remote) { this.piece = null; this.phase = 'wait'; this.chain = 0; this.pump(); return; }
    if (this.grid[1][SP]) { this.die(); return; }
    const [a, b] = pairAt(this.idx++);
    this.piece = { x: SP, y: 1, o: 0, a, b, rx: SP, ang: 0 };
    this.acc = 0; this.phase = 'drop'; this.noGarb = false; this.chain = 0; this.soft = false; this.canHold = true;
    if (!this.fits(this.piece)) { this.die(); return; }
    if (!this.human) this.planAI();
  }
  // 홀드: 지금 쌍을 맡겨 두고 맡긴 쌍(없으면 다음 쌍)을 꺼냄. 한 번 놓을 때까지 한 번만
  hold() {
    if (this.phase !== 'drop' || !this.piece || !this.canHold) return;
    const keep = [this.piece.a, this.piece.b], [a, b] = this.holdP || pairAt(this.idx++);
    this.holdP = keep; this.canHold = false;
    this.piece = { x: SP, y: 1, o: 0, a, b, rx: SP, ang: 0 }; this.acc = 0;
    if (!this.fits(this.piece)) { this.die(); return; }
    if (this.human) sfx.hold();
  }
  die() {
    if (this.dead) return;
    this.dead = true; this.phase = 'dead'; this.piece = null;
    if (game.net && !this.remote) gsend({ t: 'dead' });
  }

  /* ---------- 온라인: 상대 화면 재현 ----------
     상대 클라이언트가 보낸 '고정(lock)'·'방해뿌요 낙하(garb)' 이벤트를 순서대로 같은 규칙으로 재생한다.
     연쇄·낙하는 결정적이라 애니메이션까지 그대로 나오고, 이벤트마다 보낸 격자 스냅샷으로 어긋나면 바로잡는다. */
  encode() { return this.grid.map(r => r.map(p => p ? p.c : 0).join('')).join(''); }
  decode(g) {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const v = +g[r * COLS + c]; this.grid[r][c] = v ? this.mk(v, r, c, r) : null;
    }
  }
  pump() {
    while (this.phase === 'wait' && this.queue.length) {
      const ev = this.queue.shift();
      if (ev.g && this.encode() !== ev.g) this.decode(ev.g);
      if (ev.t === 'lock') {
        const sp = this.piece && this.piece.n === ev.n ? this.piece : null;
        const off = sp ? Math.max(0, ev.y - (sp.y + (sp.prog || 0))) : 0;
        this.lastLockN = ev.n;
        this.piece = { x: ev.x, y: ev.y, o: ev.o, a: ev.a, b: ev.b, rx: sp ? sp.rx : ev.x, ang: sp ? sp.ang : ev.o * Math.PI / 2 };
        this.lock(off, !!ev.h);
      } else if (ev.t === 'garb') this.placeGarbage(ev.c);
    }
    if (this.phase === 'wait') this.applyNet();
  }
  applyNet() {
    const s = this.net;
    if (!s || s.n <= this.lastLockN) { this.piece = null; return; }
    if (!this.piece || this.piece.n !== s.n) this.piece = { x: s.x, y: s.y, o: s.o, a: s.a, b: s.b, rx: s.x, ang: s.o * Math.PI / 2, prog: s.p, n: s.n };
    else Object.assign(this.piece, { x: s.x, y: s.y, o: s.o, prog: s.p });
  }

  moveX(d) {
    if (this.phase !== 'drop') return;
    const p = { ...this.piece, x: this.piece.x + d };
    if (this.fits(p)) { this.piece.x = p.x; if (this.human) sfx.move(); }
  }
  rotate(dir) {
    if (this.phase !== 'drop') return;
    const q = this.piece, o = (q.o + dir + 4) % 4;
    let p = { ...q, o };
    if (!this.fits(p)) {
      p = { ...q, o, x: q.x - DX[o], y: q.y - DY[o] };
      if (!this.fits(p)) {
        const now = performance.now();
        if (this.human && now - this.blockedAt > 350) { this.blockedAt = now; sfx.move(); return; }
        this.blockedAt = 0;
        p = { ...q, o: (q.o + 2) % 4 }; if (!this.fits(p)) return;
      }
    }
    q.x = p.x; q.y = p.y; q.o = p.o; if (this.human) sfx.rot();
  }

  update(dt, active) {
    this.updateFx(dt);
    if (!active || this.dead) return;
    if (this.remote) {
      if (this.queue.length > 2) dt *= 4;            // 밀린 이벤트가 많으면 빨리 감아 따라잡기
      if (this.phase === 'wait') { this.pump(); return; }
    }
    if (this.phase === 'drop') this.updateDrop(dt);
    else if (this.phase === 'settle') this.updateSettle(dt);
    else if (this.phase === 'pop') this.updatePop(dt);
  }

  updateFx(dt) {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const p = this.grid[r][c]; if (p && p.sq >= 0) { p.sq += dt; if (p.sq > 320) p.sq = -1; }
    }
    for (const q of this.particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 0.0009 * dt; q.life -= dt; }
    this.particles = this.particles.filter(q => q.life > 0);
    for (const t of this.trails) t.age += dt;
    this.trails = this.trails.filter(t => t.age < 180);
    for (const t of this.texts) t.age += dt;
    this.texts = this.texts.filter(t => t.age < t.dur);
    this.shake = Math.max(0, this.shake - dt * 0.03);
    this.trayBump = Math.max(0, this.trayBump - dt * 0.004);
    this.hit = Math.max(0, this.hit - dt * 0.0025);
    this.flash = Math.max(0, this.flash - dt * 0.003);
    const p = this.piece;
    if (p) {
      p.rx += (p.x - p.rx) * Math.min(1, dt / 45);
      let diff = p.o * Math.PI / 2 - p.ang;
      while (diff > Math.PI) diff -= Math.PI * 2; while (diff < -Math.PI) diff += Math.PI * 2;
      p.ang += diff * Math.min(1, dt / 38);
    }
  }

  updateDrop(dt) {
    const p = this.piece;
    if (this.human) {
      const inp = game.inp[this.pi || 0];
      this.soft = inp.down;
      const dir = (inp.left ? -1 : 0) + (inp.right ? 1 : 0);
      if (dir !== this.lastDir) { this.lastDir = dir; this.das = 0; this.rep = 0; if (dir) this.moveX(dir); }
      else if (dir) { this.das += dt; if (this.das > 170) { this.rep += dt; while (this.rep >= 45) { this.rep -= 45; this.moveX(dir); } } }
    } else this.aiAct(dt);
    const iv = this.soft ? 35 : this.fallIv();
    const canFall = this.fits({ ...p, y: p.y + 1 });
    this.acc += dt;
    if (this.acc >= iv) {
      this.acc -= iv;
      if (canFall) { p.y++; if (this.soft && this.human) this.score++; }
      else { this.lock(); }
    }
  }

  // 하드드롭: 바닥까지 한 번에 내리꽂고 빠른 속도로 떨어지는 연출
  hardDrop() {
    if (this.phase !== 'drop' || !this.piece) return;
    const p = this.piece;
    const canFall = this.fits({ ...p, y: p.y + 1 });
    const from = p.y + (canFall ? Math.min(1, this.acc / (this.soft ? 35 : this.fallIv())) : 0);
    let n = 0;
    while (this.fits({ ...p, y: p.y + 1 })) { p.y++; n++; }
    if (this.human) this.score += n * 2;
    const off = p.y - from;
    if (off > 0.5) {
      const top = Math.min(from, from + DY[p.o]), cols = p.o % 2 ? [p.x, p.x + DX[p.o]] : [p.x];
      for (const c of cols) this.trails.push({ x: c, y0: top, y1: p.y + (p.o === 2 ? 1 : 0), age: 0 });
    }
    this.lock(off, true);
  }

  lock(off = 0, hard = false) {
    const p = this.piece, sx = p.x + DX[p.o], sy = p.y + DY[p.o];
    if (game.net && !this.remote) gsend({ t: 'lock', n: this.idx, x: p.x, y: p.y, o: p.o, a: p.a, b: p.b, h: hard ? 1 : 0, g: this.encode() });
    const m = this.mk(p.a, p.y, p.x, p.y - off), s = this.mk(p.b, sy, sx, sy - off);
    if (hard) for (const q of [m, s]) { q.vy = 0.05; q.vmax = 0.09; q.hard = true; }
    this.grid[p.y][p.x] = m; this.grid[sy][sx] = s;
    this.piece = null; this.compact(); this.phase = 'settle'; this.settleT = 0; this.chain = 0;
    for (const q of [m, s]) if (q.y === q.r) this.land(q, hard ? 1 : 0.75);
    if (hard) { this.shake = Math.max(this.shake, 3); if (off <= 0.5) sfx.slam(); }
    else sfx.land();
  }

  // 착지 출렁임: 내려앉은 뿌요 + 그 아래 쌓인 뿌요들이 깊이에 따라 약하게 함께 눌린다
  land(p, amp) {
    p.sq = 0; p.amp = amp;
    for (let r = p.r + 1, d = 1; r < ROWS; r++, d++) {
      const q = this.grid[r][p.col]; if (!q || q.y !== q.r) break;
      const a = amp * Math.pow(0.55, d); if (a < 0.06) break;
      if (q.sq < 0 || q.amp < a) { q.sq = 0; q.amp = a; }
    }
  }

  compact() {
    for (let c = 0; c < COLS; c++) {
      let w = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        const p = this.grid[r][c]; if (!p) continue;
        if (r !== w) { this.grid[w][c] = p; this.grid[r][c] = null; }
        p.r = w; p.col = c; w--;
      }
    }
  }

  updateSettle(dt) {
    let moving = false, landed = false, garb = false, slam = false;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const p = this.grid[r][c]; if (!p || p.y >= p.r) continue;
      if (p.vy === 0) p.vy = V0;
      p.vy = Math.min(p.vmax || VMAX, p.vy + G * dt); p.y += p.vy * dt;
      if (p.y >= p.r) { p.y = p.r; const amp = clamp(0.35 + p.vy * 25, 0.35, 1); p.vy = 0; p.vmax = 0; this.land(p, amp); landed = true;
        if (p.c === OJ) garb = true; if (p.hard) { slam = true; p.hard = false; } }
      else moving = true;
    }
    if (landed) { slam ? sfx.slam() : garb ? sfx.garb() : sfx.land(); }
    if (moving) { this.settleT = 0; return; }
    this.settleT += dt;
    if (this.settleT >= 110) { this.settleT = 0; this.afterSettle(); }
  }

  findGroups() {
    const seen = Array.from({ length: ROWS }, () => Array(COLS).fill(false)), out = [];
    for (let r = 1; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const p = this.grid[r][c]; if (!p || p.c === OJ || seen[r][c]) continue;
      const st = [[r, c]], cells = []; seen[r][c] = true;
      while (st.length) {
        const [y, x] = st.pop(); cells.push(this.grid[y][x]);
        for (let d = 0; d < 4; d++) {
          const ny = y + DY[d], nx = x + DX[d];
          if (ny >= 1 && ny < ROWS && nx >= 0 && nx < COLS && !seen[ny][nx] && this.grid[ny][nx] && this.grid[ny][nx].c === p.c) { seen[ny][nx] = true; st.push([ny, nx]); }
        }
      }
      if (cells.length >= 4) out.push({ c: p.c, cells });
    }
    return out;
  }

  afterSettle() {
    const gs = this.findGroups();
    if (gs.length) { this.chain++; this.beginPop(gs); } else this.endChain();
  }

  beginPop(gs) {
    this.popList = []; const set = new Set(); let total = 0, sx = 0, sy = 0;
    let bonus = CHAIN_POWER[Math.min(this.chain, CHAIN_POWER.length - 1)]; const cols = new Set();
    for (const g of gs) { total += g.cells.length; bonus += groupBonus(g.cells.length); cols.add(g.c);
      for (const p of g.cells) { this.popList.push(p); set.add(p); sx += p.col; sy += p.y; } }
    bonus += COLOR_BONUS[Math.min(cols.size, 5)];
    const step = 10 * total * clamp(bonus, 1, 999);
    this.score += step; this.pops += total;
    if (!game.vs) this.level = 1 + Math.floor(this.pops / 40);
    const tp = targetPt(); this.carry += step; let units = Math.floor(this.carry / tp); this.carry -= units * tp;
    if (this.chain === 1 && this.acBonus) {        // 전멸 보너스: 다음 연쇄 첫 단계에 방해뿌요 30개(테트리스 상대는 2100점)
      this.acBonus = false;
      if (this.opp && this.opp.kind === 'tetris') this.lineCarry += 2100; else units += 30;
    }
    const n = this.popList.length;
    for (const p of [...this.popList]) for (let d = 0; d < 4; d++) {
      const ny = p.r + DY[d], nx = p.col + DX[d];
      if (ny >= 1 && ny < ROWS && nx >= 0 && nx < COLS) { const q = this.grid[ny][nx]; if (q && q.c === OJ && !set.has(q)) { set.add(q); this.popList.push(q); } }
    }
    this.popSet = set; this.popT = 0; this.phase = 'pop';
    this.maxChain = Math.max(this.maxChain, this.chain);
    sfx.pop(this.chain);
    const ax = clamp((sx / n + 0.5) * CS, 60, FW - 60), ay = clamp((sy / n - 1 + 0.5) * CS, 40, FH - 40);
    if (this.opp && this.opp.kind === 'tetris') this.attackT(step, units, this.ox + ax, this.oy + ay);
    else this.attack(units, this.ox + ax, this.oy + ay);
    this.texts.push({ txt: this.chain + '연쇄!', x: ax, y: ay,
      age: 0, dur: 1200, col: CH_COL[(this.chain - 1) % CH_COL.length], size: 28 + Math.min(this.chain, 8) * 2.5 });
    if (cols.size >= 2) {                      // 2색 이상 동시 소거: 더블 / 트리플 / 쿼드
      this.doubles++;
      const label = ['', '', '더블!', '트리플!', '쿼드!', '쿼드!'][Math.min(cols.size, 5)];
      const dy = ay > FH - 110 ? -58 : 58;
      this.texts.push({ txt: label, x: ax, y: ay + dy, age: -120, dur: 1400, col: '#fff', size: 38 + (cols.size - 2) * 6,
        rainbow: [...cols].map(c => PAL[c].m), wobble: true });
      ring(this.ox + ax, this.oy + ay + dy, '#ffffff', 12, 80 + cols.size * 14, 480, 6);
      for (const c of cols) ring(this.ox + ax, this.oy + ay + dy, PAL[c].m, 8, 56 + cols.size * 10, 420, 4);
      burst(this.ox + ax, this.oy + ay + dy, '#fff6c2', 10 + cols.size * 6, 0.32);
      setTimeout(() => sfx.double(cols.size), 110);
    }
  }

  updatePop(dt) {
    this.popT += dt;
    if (this.popT < POP_T) return;
    for (const p of this.popList) {
      this.grid[p.r][p.col] = null;
      const cx = p.col * CS + CS / 2, cy = (p.r - 1) * CS + CS / 2;
      for (let i = 0; i < 9; i++) {
        const a = Math.random() * Math.PI * 2, s = 0.08 + Math.random() * 0.28;
        this.particles.push({ x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.12, life: 500 + Math.random() * 350, max: 850,
          r: 3 + Math.random() * 4, col: i % 3 ? PAL[p.c].m : '#ffffff' });
      }
    }
    this.popList = []; this.popSet = null;
    this.flash = Math.min(0.55, 0.18 + this.chain * 0.06); this.shake = Math.min(8, 1.5 + this.chain * 1.2);
    this.compact(); this.phase = 'settle'; this.settleT = 0;
  }

  isEmpty() { for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.grid[r][c]) return false; return true; }

  // 연쇄 한 단계마다 바로 공격: 내 쪽에 쌓인 방해뿌요부터 상쇄하고 남은 만큼 상대에게 날림
  attack(units, x, y) {
    if (!game.vs || units <= 0 || this.remote) return;
    let n = units;
    if (!this.human) { this.atkCarry += units * this.ai.atk; n = Math.floor(this.atkCarry); this.atkCarry -= n; }
    if (n <= 0) return;
    this.sent += n;
    const c = Math.min(this.pending, n);
    const rx = x - this.ox, ry = y - this.oy;
    if (c > 0) { this.pending -= c; n -= c; game.launch(this, this, c, x, y, 'offset'); if (game.net) gsend({ t: 'off', n: c, x: rx, y: ry, ch: this.chain }); }
    if (n > 0) { game.launch(this, this.opp, n, x, y, 'attack'); if (game.net) gsend({ t: 'atk', n, x: rx, y: ry, ch: this.chain }); }
  }

  // 테트리스 상대: 연쇄 단계 점수(+이월)가 210·630·1050·1710·3500·7000·14000점에 닿으면 1~7줄.
  // 내 예고 방해뿌요는 평소처럼 상쇄하고, 상쇄량이 예고를 넘어선 단계부터 줄 공격이 쌓여 연쇄가 끝날 때 한 번에 감
  attackT(step, units, x, y) {
    if (!game.vs || this.remote) return;
    this.lineCarry += step;
    let lines = 0;
    const mf = targetPt() / 70;
    for (let i = P2T.length - 1; i >= 0; i--) if (this.lineCarry >= P2T[i] * mf) { lines = i + 1; this.lineCarry -= P2T[i] * mf; break; }
    if (this.pending > 0) {
      const before = this.pending, c = Math.min(this.pending, Math.max(1, units));
      this.pending -= c; game.launch(this, this, c, x, y, 'offset');
      if (game.net) gsend({ t: 'off', n: c, x: x - this.ox, y: y - this.oy, ch: this.chain });
      if (units <= before) lines = 0;
    }
    if (!this.human) { this.lineAtk += lines * this.ai.atk; lines = Math.floor(this.lineAtk); this.lineAtk -= lines; }
    this.lineOut += lines; this.sent += lines; this.lastAtkXY = [x, y];
  }

  endChain() {
    if (this.chain > 0 && this.opp && this.opp.kind === 'tetris' && !this.remote) {
      if (this.lineOut > 0 && game.vs) {
        const [x, y] = this.lastAtkXY || [this.ox + FW / 2, this.oy + FH / 2];
        game.launch(this, this.opp, this.lineOut, x, y, 'attack');
        if (game.net) gsend({ t: 'atk', n: this.lineOut, x: x - this.ox, y: y - this.oy, ch: this.chain });
      }
      this.lineOut = 0; this.lineCarry = 0;
    }
    if (this.chain > 0) {
      if (this.chain >= 2) this.chains2++;
      if (this.isEmpty()) {
        this.allClears++;
        this.texts.push({ txt: '전멸!', x: FW / 2, y: FH / 2, age: 0, dur: 1600, col: '#ffd93d', size: 44 }); sfx.clear();
        if (game.vs) this.acBonus = true;
      }
      this.lastChain = this.chain;
    }
    this.chain = 0;
    if (this.remote) { this.spawn(); return; }
    if (this.pending > 0 && !this.noGarb) { this.dropGarbage(); return; }
    this.spawn();
  }

  dropGarbage() {
    const n = Math.min(30, this.pending); this.pending -= n; this.noGarb = true;
    const counts = Array(COLS).fill(Math.floor(n / COLS)); const order = [...Array(COLS).keys()].sort(() => Math.random() - 0.5);
    for (let i = 0; i < n % COLS; i++) counts[order[i]]++;
    if (game.net && !this.remote) gsend({ t: 'garb', c: counts, g: this.encode() });
    this.placeGarbage(counts);
  }

  placeGarbage(counts) {
    for (let c = 0; c < COLS; c++) {
      const off = Math.random() * 2;
      for (let k = 0; k < counts[c]; k++) {
        let r = ROWS - 1; while (r >= 0 && this.grid[r][c]) r--;
        if (r < 0) break;
        this.grid[r][c] = this.mk(OJ, r, c, -1.5 - k * 1.1 - off);
      }
    }
    this.phase = 'settle'; this.settleT = 0;
  }

  /* ---------- CPU ---------- */
  colorGrid() { return this.grid.map(row => row.map(p => p ? p.c : 0)); }

  planAI() {
    const g = this.colorGrid(), p = this.piece, hs = heightsOf(g), maxH = Math.max(...hs);
    const danger = maxH >= VIS - 3 || this.pending >= 12;
    let best = null, bestS = -Infinity; const cands = [];
    for (let x = 0; x < COLS; x++) for (let o = 0; o < 4; o++) {
      const sx = x + DX[o]; if (sx < 0 || sx >= COLS) continue;
      let ok = true; const lo = Math.min(SP, x, sx), hi = Math.max(SP, x, sx);
      for (let c = lo; c <= hi; c++) if (g[1][c] || g[0][c]) ok = false;
      if (!ok) continue;
      const s = g.map(r => r.slice());
      const low = c => { let r = ROWS - 1; while (r >= 0 && s[r][c]) r--; return r; };
      let py, sy;
      if (o === 0) { py = low(x); sy = py - 1; } else if (o === 2) { sy = low(x); py = sy - 1; } else { py = low(x); sy = low(sx); }
      if (py < 1 || sy < 1) continue;

  aiAct(dt) {
    this.aiT -= dt; if (this.aiT > 0 || !this.tgt) return;
    this.aiT = this.ai.delay * (0.7 + Math.random() * 0.6);
    const p = this.piece, t = this.tgt;

  draw(t) {

    const tone = this.tone || TONES.red;
    // 이름표
    c.save();
    slab(c, this.ox + 14, 2, FW - 28, 32, tone, 4);
    outlined(c, this.name, this.ox + FW / 2, 19, 20, '#fff', tone.d, 6);
    // 점수판
    const sy = this.oy + FH + 16;
    slab(c, this.ox + 6, sy, FW - 12, 50, TONES.white, 4);
    c.textBaseline = 'middle'; c.textAlign = 'left'; c.fillStyle = '#6d6b80'; c.font = '15px ' + FONT();

        if (p.sq >= 0) { const f = bounceF(p.sq); sy = 1 - 0.3 * p.amp * f; sx = 1 + 0.17 * p.amp * f; }
        let cy = (p.y - 1) * CS + CS / 2;
        if (settled) { cy += shift + (CS / 2) * (1 - sy); shift += CS * (1 - sy); } else shift = 0;
        const pop = popping(p);

      c.beginPath(); c.arc(q.x, q.y, q.r * (0.4 + 0.6 * q.life / q.max), 0, Math.PI * 2); c.fill();
    }

    if (this.flash > 0) { c.fillStyle = `rgba(255,255,255,${this.flash})`; c.fillRect(0, 0, FW, FH); }
    if (this.hit > 0) { c.strokeStyle = `rgba(255,79,106,${this.hit})`; c.lineWidth = 10; c.strokeRect(0, 0, FW, FH); }
    for (const tx of this.texts) {

      const k = tx.age / tx.dur, e = tx.age < 200 ? (() => { const u = tx.age / 200, s = 1.70158; return 1 + (s + 1) * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2); })() : 1;
      c.save(); c.globalAlpha = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
      c.translate(tx.x, tx.y - tx.age * 0.02); c.scale(0.3 + 0.7 * e, 0.3 + 0.7 * e);
      if (tx.wobble) c.rotate(Math.sin(tx.age / 70) * 0.08 * Math.max(0, 1 - tx.age / 600));

      c.lineWidth = tx.rainbow ? 10 : 7; c.lineJoin = 'round'; c.strokeStyle = '#2a1d6b'; c.strokeText(tx.txt, 0, 0);
      if (tx.rainbow) {                       // 지워진 색들로 채운 글자 + 흰 테두리
        const half = tx.size * tx.txt.length * 0.32, g = c.createLinearGradient(-half, 0, half, 0);
        tx.rainbow.forEach((col, i) => g.addColorStop(tx.rainbow.length === 1 ? 0 : i / (tx.rainbow.length - 1), col));

    if (danger !== this.dangerOn) { this.dangerOn = danger; if (danger && this.human) sfx.danger(); }
    if (danger) {

      c.save(); c.globalAlpha = a; c.translate(FW / 2, 40); c.rotate(-0.04);
      slab(c, -96, -22, 192, 44, TONES.red, 4); outlined(c, '위험!', 0, 1, 28, '#fff', TONES.red.d, 7);
      c.restore();

      c.save(); c.translate(FW - 70, FH - 22); slab(c, -62, -15, 124, 30, TONES.yellow, 3);
      outlined(c, '전멸 보너스', 0, 1, 15, '#fff', TONES.yellow.d, 4); c.restore();

      c.fillStyle = 'rgba(20,16,50,0.45)'; c.fillRect(0, 0, FW, FH);

}

/* ================= 테트리스 필드 =================
   조사한 원작(뿌요뿌요 테트리스) 규칙
   - 10×20 필드(+위 2줄 숨김), SRS 회전·월킥, 7종 가방 랜덤, 홀드, 다음 5개, 하드드롭, 고스트
   - 공격(테트리스 상대): 1줄 0 · 2줄 1 · 3줄 2 · 테트리스 4 · T스핀 싱글 2/더블 4/트리플 6 · 퍼펙트 10 · B2B +1 · REN 보너스
   - 공격(뿌요 상대): T스핀 더블 3 · 트리플 4 · 퍼펙트 6(+REN) · REN 보너스 약화, 공격은 '게이지'에 모았다가
     줄을 지우지 않는 블록을 놓을 때 한 번에 방해뿌요로 변환해 보냄(1→4, 2→5, 3→6, 4→8, 10→28 …)
   - 뿌요의 공격을 테트리스가 받을 때: 연쇄 한 단계 점수가 210·630·1050·1710·3500·7000·14000점에 닿을 때마다 1~7줄,
     연쇄가 끝나면 한 번에 아래에서 구멍 한 칸짜리 줄로 올라옴(한 번에 최대 7줄) */

const TKEYS = ['', 'I', 'O', 'T', 'S', 'Z', 'J', 'L', 'G'];

  Z: ['XX.', '.XX', '...'], J: ['X..', 'XXX', '...'], L: ['..X', 'XXX', '...'] };
const TROT = {};
for (const k in TSHAPE) {
  let m = TSHAPE[k].map(r => [...r].map(ch => ch === 'X'));
  TROT[k] = [];
  for (let i = 0; i < 4; i++) {
    TROT[k].push(m.flatMap((row, r) => row.map((v, c) => v ? [c, r] : null).filter(Boolean)));
    const n = m.length; m = Array.from({ length: n }, (_, r) => Array.from({ length: n }, (_, c) => m[n - 1 - c][r]));
  }

  257,278,300,323,347,372,398,425,453,482,512,543,575,608,642,677,713,750,788,827,867,908,950,993,1037,1082,1128,1175,1223,1272];
const P2T = [210, 630, 1050, 1710, 3500, 7000, 14000];
// 마진 타임: 대전 시작 96초 후부터 16초마다 공격력이 오름(뿌요: 목표 점수 감소 / 테트리스: 보내는 줄 배율)
const MARGIN_START = 96000, MARGIN_STEP = 16000, TSU_TP = [70, 52, 35, 26, 17, 13, 8, 6, 4, 3, 2, 1];
function marginLv() {

// 7종 가방(양쪽 같은 순서)
let tseq = [], tRng = Math.random;
function tPieceAt(i) {
  while (tseq.length <= i) {
    const bag = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
    for (let j = bag.length - 1; j > 0; j--) { const r = Math.floor(tRng() * (j + 1)); [bag[j], bag[r]] = [bag[r], bag[j]]; }

function drawBlock(c, x, y, s, col, alpha = 1) {
  c.save(); c.globalAlpha = alpha;

  const g = c.createLinearGradient(x, y, x + s, y + s);

  c.fillStyle = g; rr(c, x + 1, y + 1, s - 2, s - 2, 4); c.fill();

  c.strokeStyle = 'rgba(0,0,0,0.35)'; c.lineWidth = 1.5; rr(c, x + 1.5, y + 1.5, s - 3, s - 3, 4); c.stroke();

function drawMino(c, k, cx, cy, s, alpha = 1) {
  const cells = TROT[k][0], xs = cells.map(p => p[0]), ys = cells.map(p => p[1]);
  const w = Math.max(...xs) - Math.min(...xs) + 1, h = Math.max(...ys) - Math.min(...ys) + 1;

}

class TField {

  update(dt, active) {

  // T스핀 판정: 3코너 규칙, 앞쪽 두 칸이 모두 막혔거나 5번째 킥이면 정식, 아니면 미니
  tspinType() {

  lock(hard) {

    const pc = rows.length > 0 && filledAfter === 0;
    if (game.net && !this.remote) gsend({ t: 'tlock', g: this.encode(), rows, fx: this.lockFx(rows.length, ts, pc, true) });
    this.shake = Math.max(this.shake, hard ? 2.5 : 0);
    if (rows.length) {

    if (fx.pc) push('퍼펙트 클리어!', '#ffd93d', 34);

  }

  updateClear(dt) {

        for (let i = 0; i < 2; i++) { const a = Math.random() * Math.PI * 2, s = 0.06 + Math.random() * 0.22;

    for (let i = 0; i < n; i++) {

  /* ---------- CPU: 놓을 수 있는 모든 자리를 평가(높이·구멍·울퉁불퉁함·지운 줄) ---------- */
  evalPlace(p) {
    const g = this.grid.map(r => r.slice());
    for (const [x, y] of this.cells(p)) g[y][x] = 1;
    const kept = g.filter(r => !r.every(Boolean)), lines = TH - kept.length;

  }
  planAI() {

    let best = null, bs = -Infinity; const cands = [];
    for (const o of opts) for (let r = 0; r < (o.k === 'O' ? 1 : 4); r++) for (let x = -2; x < TW; x++) {

      while (this.valid({ ...p, y: p.y + 1 })) p.y++;

  }

  /* ---------- 그리기 ---------- */
  draw(t) {

    const tone = this.tone || TONES.red;
    c.save();
    const GW = TW * TC, gx = this.ox + TGX;
    slab(c, gx + 4, 2, GW - 8, 32, tone, 4);
    outlined(c, this.name, this.ox + FW / 2, 19, 20, '#fff', tone.d, 6);
    const sy = this.oy + FH + 16;
    slab(c, gx - 8, sy, GW + 16, 50, TONES.white, 4);
    c.textBaseline = 'middle'; c.textAlign = 'left'; c.fillStyle = '#6d6b80'; c.font = '15px ' + FONT();
    c.fillText('점수', gx + 14, sy + 26);
    c.fillStyle = '#22212e'; c.font = '26px ' + HFONT(); c.fillText(this.score.toLocaleString(), gx + 50, sy + 27);
    slab(c, gx + GW - 104, sy + 9, 92, 32, tone, 3);
    outlined(c, `최고 ${this.maxChain} REN`, gx + GW - 58, sy + 26, 15, '#fff', tone.d, 4);
    c.restore();
    this.drawTray(c);

    c.save(); c.translate(this.ox + shx, this.oy + shy);
    const B = 8;
    c.fillStyle = 'rgba(0,0,0,0.16)'; c.fillRect(TGX - B, -B + 6, GW + B * 2, FH + B * 2);
    c.fillStyle = tone.d; c.fillRect(TGX - B, -B, GW + B * 2, FH + B * 2);
    c.fillStyle = '#fff'; c.fillRect(TGX - 4, -4, GW + 8, FH + 8);
    // 공격 게이지(뿌요 상대일 때): 테두리 왼쪽 바깥, 20칸마다 초록→노랑→빨강
    if (this.vsPuyo() && this.gauge > 0) {
      const lap = Math.floor((this.gauge - 1) / 20), k = ((this.gauge - 1) % 20 + 1) / 20, gx0 = TGX - B - 9;
      c.fillStyle = 'rgba(0,0,0,0.25)'; c.fillRect(gx0, 0, 7, FH);
      if (lap > 0) { c.fillStyle = ['#39c63c', '#ffc915', '#ff4559'][lap - 1]; c.fillRect(gx0, 0, 7, FH); }
      c.fillStyle = ['#39c63c', '#ffc915', '#ff4559'][Math.min(2, lap)]; c.fillRect(gx0, FH * (1 - k), 7, FH * k);
      c.fillStyle = 'rgba(255,255,255,0.5)'; c.fillRect(gx0 + 1, FH * (1 - k), 2, FH * k);
    }
    c.save(); c.beginPath(); c.rect(TGX, 0, GW, FH); c.clip();
    c.fillStyle = '#1b1548'; c.fillRect(TGX, TGY, GW, TVIS * TC);
    c.strokeStyle = 'rgba(255,255,255,0.05)'; c.lineWidth = 1;

  const r = a.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;

  for (const t of ts) {

    const along = x * dx + y * dy; if (along <= 4) continue;

    const sc = along + (overlap > 0 ? 0 : Math.abs(x * dy - y * dx) * 2);

function fitCanvas(c) {
  const w = c.clientWidth, h = c.clientHeight;

  c.width = w * DPR; c.height = h * DPR;
  const x = c.getContext('2d'); x.setTransform(DPR, 0, 0, DPR, 0, 0); x.clearRect(0, 0, w, h);

}
function miniField(x, rows, x0, y0, w, h) {
  const nr = rows.length, nc = rows[0].length, cell = Math.min(w / nc, h / nr);

  x.fillStyle = '#1e174e'; x.fillRect(x0, y0, w, h);
  for (let r = 0; r < nr; r++) for (let q = 0; q < nc; q++) { x.fillStyle = (r + q) % 2 ? '#191342' : '#211a55'; x.fillRect(ox + q * cell, oy + r * cell, cell, cell); }
  const items = [], links = [], quads = [], map = {};
  rows.forEach((row, r) => [...row].forEach((ch, q) => { const v = +ch; if (!v) return; const it = { cx: q * CS + CS / 2, cy: r * CS + CS / 2, rx: R, ry: R, col: v }; items.push(it); map[r + ',' + q] = it; }));
  rows.forEach((row, r) => [...row].forEach((ch, q) => {
    const v = +ch, a = map[r + ',' + q]; if (!v || v === OJ) return;
    const rt = map[r + ',' + (q + 1)], dn = map[(r + 1) + ',' + q], dg = map[(r + 1) + ',' + (q + 1)];
    if (rt && rt.col === v) { a.mask = (a.mask || 0) | RT; rt.mask = (rt.mask || 0) | LT; links.push([a, rt]); }
    if (dn && dn.col === v) { a.mask = (a.mask || 0) | DN; dn.mask = (dn.mask || 0) | UP; links.push([a, dn]); }
    if (rt && dn && dg && rt.col === v && dn.col === v && dg.col === v) quads.push([a, rt, dn, dg]);
  }));

}
function drawArts() {
  document.querySelectorAll('#menu .screen:not(.hidden) canvas.art').forEach(c => {
    const g = fitCanvas(c); if (!g) return; const { x, w, h } = g, kind = c.dataset.art;
    if (SCENES[kind]) miniField(x, SCENES[kind].rows, 0, 0, w, h);
    else if (kind === 'vs') {

      x.fillStyle = gr; x.beginPath(); x.arc(w - fw * 0.5, h * 0.18, 16, 0, Math.PI * 2); x.fill();

}

// 공격 구슬: 연쇄 위치에서 출발해 크게 호를 그리며 상대 방해뿌요 칸으로 날아감(상쇄는 내 칸으로 짧게)

  const col = kind === 'offset' ? '#8fd0ff' : CH_COL[Math.max(0, (ch == null ? from.chain : ch) - 1) % CH_COL.length];
  const tx = to.ox + FW / 2, ty = to.oy - 32;
  game.orbs.push({ x0: x, y0: y, x1: tx, y1: ty, t: 0, dur: kind === 'attack' ? 720 : 420, n, to, kind, col,
    size: 9 + Math.min(16, Math.sqrt(n) * 3.2), lift: kind === 'attack' ? 170 + Math.min(120, n * 3) : 60, trail: [] });

}

function update(dt) {

      game.marginLv = lv; sfx.margin();

    $('roomBox').classList.add('hidden'); $('bCancel').classList.add('hidden');
    if (game.net && (game.state === 'play' || game.state === 'over')) {
      game.net = false; showMessage('연결 끊김', '서버와의 연결이 끊겼습니다. 다시 접속해 주세요.');
    }
  };
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (_) { return; } onNet(m); };
}
function onNet(m) {
  switch (m.t) {
    case 'created':
      $('roomCode').textContent = m.code; $('roomBox').classList.remove('hidden'); $('bCancel').classList.remove('hidden');
      status('상대에게 방 코드를 알려주고 기다리세요.'); break;
    case 'waiting': $('bCancel').classList.remove('hidden'); status('상대를 찾는 중…'); break;
    case 'error': status(m.msg); break;
    case 'start': $('roomBox').classList.add('hidden'); $('bCancel').classList.add('hidden'); status('');
      if (!m.styles) { status('서버가 예전 버전이라 서로의 스타일을 알 수 없어요. 서버를 끄고 새 server.js로 다시 켜 주세요.'); nsend({ t: 'leave' }); break; }
      start('online', m.seed, { me: m.styles[m.you], op: m.styles[1 - m.you] }); break;
    case 'oppReady': $('ovSub').textContent = '상대가 다시 하기를 눌렀습니다.'; break;
    case 'left':
      game.oppLeft = true; game.resetOnline = true;
      if (game.state === 'over' || (game.fields[1] && game.fields[1].dead)) {   // 이미 끝난 판(기권 포함): 결과는 그대로, 다시 하기만 막음
        game.net = false;
        if (!overlay.classList.contains('hidden')) { overlayBtns('menu'); $('ovSub').textContent += ' · 상대가 나갔습니다'; }
      } else if (game.net) { game.net = false; showMessage('상대가 나갔습니다', '메뉴에서 새 대전을 시작하세요.'); }
      break;
    case 'g': onGame(m.d); break;
  }
}
function onGame(d) {
  const me = game.fields[0], op = game.fields[1];
  if (!op || !op.remote || game.mode !== 'online') return;
  switch (d.t) {
    case 'st':
      op.pending = d.pe; op.score = d.sc; op.maxChain = d.mc;
      if (op.kind === 'tetris') { op.net = d.pc; op.holdK = d.ho; op.gauge = d.gg || 0; }
      else { op.net = d.pc ? { ...d.pc, n: d.n } : null; if (op.phase === 'wait') op.applyNet(); }
      break;
    case 'lock': case 'garb': case 'tlock': case 'tgarb': op.queue.push(d); break;
    case 'atk': if (game.state === 'play') game.launch(op, me, d.n, op.ox + d.x, op.oy + d.y, 'attack', d.ch); break;
    case 'off': game.launch(op, op, d.n, op.ox + d.x, op.oy + d.y, 'offset', d.ch); break;
    case 'dead': if (game.state === 'play') op.die(); break;
    case 'hi': op.name = String(d.name || '상대').slice(0, 10); break;
  }
}
// 서버가 알려주는 내부망 주소를 표시 — 다른 사람은 이 주소로 접속하면 된다
function showLan() {
  if (!location.protocol.startsWith('http')) return;
  fetch('/info').then(r => r.json()).then(info => {
    if (!info.lan || !info.lan.length) return;
    $('lanInfo').innerHTML = '다른 사람 접속 주소 ' + info.lan.map(u => `<b>${esc(u)}</b>`).join(' · ');
    $('lanInfo').classList.remove('hidden');
  }).catch(() => {});
}
function cancelWait() { nsend({ t: 'leave' }); $('roomBox').classList.add('hidden'); $('bCancel').classList.add('hidden'); status(''); }
$('bCancel').addEventListener('click', cancelWait);
$('bJoin').addEventListener('click', () => {
  const code = $('code').value.trim().toUpperCase();
  if (code.length !== 4) { status('4자리 방 코드를 입력하세요.'); return; }
  game.resetOnline = true;
  connect(() => nsend({ t: 'join', code, style: stats.style || 'puyo' }));
});
$('code').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') $('bJoin').click(); });
$('srv').addEventListener('keydown', e => e.stopPropagation());
$('bRematch').addEventListener('click', () => { nsend({ t: 'ready', style: stats.style || 'puyo' }); $('ovSub').textContent = '상대를 기다리는 중…'; });
$('bLeave').addEventListener('click', () => { nsend({ t: 'leave' }); game.net = false; openMenu('vs', 't-quick'); });

document.querySelectorAll('#pad button').forEach(btn => {
  const k = btn.dataset.k;
  btn.addEventListener('pointerdown', e => {
    e.preventDefault(); btn.classList.add('on');
    if (k === 'left' || k === 'right') playerAction(0, k, true); else if (k === 'down') playerAction(0, 'soft', true);
    else if (k === 'hard') { const f = human(); if (f) f.hardDrop(); }
    else if (k === 'menu') openPause();
    else if (k === 'hold') { const f = human(); if (f && f.hold) f.hold(); }
    else { const f = human(); if (f) f.rotate(k === 'cw' ? 1 : -1); }
  });
  const up = () => { btn.classList.remove('on'); if (k === 'left' || k === 'right') playerAction(0, k, false); else if (k === 'down') playerAction(0, 'soft', false); };
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => btn.addEventListener(ev, up));
});

/* ================= 시작 ================= */
build('vs');
openMenu('main');
document.fonts && document.fonts.ready.then(() => { if (game.state === 'menu') drawArts(); });
let last = 0;
function frame(ts) {
  const dt = Math.min(50, ts - (last || ts)); last = ts;
  pollPads();
  if (game.state !== 'pause' && game.state !== 'menu') update(dt);
  if (game.state !== 'menu') render(ts);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
