<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뿌요뿌요</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --font: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --head: "Black Han Sans", "Jua", "Malgun Gothic", sans-serif;
    --ink: #22212e; --muted: #6d6b80;
    --bandH: clamp(58px, 10vh, 92px); --footH: clamp(46px, 8vh, 70px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--ink); font-family: var(--font);
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.55) 0 3px, transparent 3px 28px),
      linear-gradient(180deg, #eef0f5, #d9dbe5);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(var(--bandH) + 10px + env(safe-area-inset-top, 0px)) 8px calc(var(--footH) + 6px + env(safe-area-inset-bottom, 0px));
    overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .hidden { display: none !important; }
  .gear { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); right: 14px; z-index: 6; font-family: var(--head); font-size: 16px;
    border: 0; border-radius: 999px; padding: 6px 14px; background: #2f78f0; color: #fff; cursor: pointer; box-shadow: 0 3px 0 #1747b0; }
  .modal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(26,20,60,0.5); padding: 16px; }
  .setcard { width: min(560px, 100%); max-height: 90vh; }
  .setcard h3 small { font-family: var(--font); font-size: 13px; color: var(--muted); }
  .setrow { display: grid; grid-template-columns: 90px 1fr 48px; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 16px; }
  .keylist { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 8px; align-items: center; font-size: 15px; margin-bottom: 8px; }
  .keylist button { font-family: var(--font); font-size: 14px; min-width: 110px; padding: 5px 8px; border: 2px solid #cfd1dc; border-radius: 6px; background: #f6f6fa; cursor: pointer; }
  .keylist button.wait { border-color: #2f78f0; background: #e6efff; }
  .padinfo { font-size: 14px; color: var(--muted); margin: 6px 0 10px; }
  .stylebar {
    grid-column: 1 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; background: #fff;
    border: 3px solid #cfd1dc; border-radius: 6px; padding: 7px 14px; box-shadow: 0 4px 0 rgba(0,0,0,0.06);
  }
  .stylebar .lab { font-family: var(--head); font-size: 17px; color: #3a3850; }
  .segs { display: flex; background: #e9eaf1; border-radius: 999px; padding: 3px; }
  .seg { font-family: var(--head); font-size: 16px; border: 0; background: transparent; color: #6d6b80; padding: 6px 16px; border-radius: 999px; cursor: pointer; }
  .seg.on { background: var(--c); color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,0.2); }
  .seg:focus-visible, .seg:focus { outline: 3px solid #1f74f0; outline-offset: 1px; }

  /* ---------- 위·아래 사선 띠 ---------- */
  .band-top {
    position: fixed; left: 0; top: 0; z-index: 5; height: calc(var(--bandH) + env(safe-area-inset-top, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    width: min(62vw, 720px); background: linear-gradient(90deg, #ff2b47, #ff6a1f 70%, #ff8f1f);
    clip-path: polygon(0 0, 100% 0, 86% 100%, 0 100%); display: flex; align-items: center;
  }
  .band-top h1 {
    margin: 0; padding-left: clamp(18px, 5vw, 64px); font-family: var(--head); font-weight: 400;
    font-size: clamp(24px, 4.4vh, 42px); color: #fff; letter-spacing: 1px; text-shadow: 0 3px 0 rgba(120, 10, 20, 0.35);
  }
  .band-white {
    position: fixed; top: 0; right: 0; z-index: 4; height: calc(var(--bandH) * 0.62 + env(safe-area-inset-top, 0px)); width: 46vw;
    background: #fff; clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%);
  }
  .band-bot {
    position: fixed; right: 0; bottom: 0; z-index: 5; height: calc(var(--footH) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    width: min(64vw, 760px); background: linear-gradient(90deg, #1b5fd9, #1f74f0);
    clip-path: polygon(9% 0, 100% 0, 100% 100%, 0 100%);
    display: flex; align-items: center; justify-content: flex-end; gap: clamp(12px, 2.4vw, 30px);
    padding-right: clamp(16px, 4vw, 56px); color: #fff; font-size: clamp(14px, 2.2vh, 19px); white-space: nowrap;
  }
  .band-bot span { display: inline-flex; align-items: center; gap: 8px; }
  kbd {
    font-family: var(--font); font-size: 13px; min-width: 28px; height: 28px; padding: 0 7px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; background: #fff; color: #1b5fd9; box-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }

  /* ---------- 메뉴 ---------- */
  #menu { width: min(1320px, 96vw); display: flex; flex-direction: column; gap: 14px; height: 100%; max-height: 800px; }
  body.ingame { --bandH: clamp(44px, 7vh, 62px); --footH: clamp(36px, 6vh, 52px); }
  body.ingame .band-white { display: none; }
  body.ingame .band-top h1 { font-size: clamp(20px, 3.4vh, 32px); }
  .mwrap { position: relative; flex: 1; min-height: 0; }
  .tag {
    position: absolute; top: -26px; right: 7%; z-index: 3; background: #1aa0e8; color: #fff; font-family: var(--head);
    font-size: 15px; padding: 1px 12px; border-radius: 3px; box-shadow: 0 2px 0 rgba(0,0,0,0.2);
  }
  .screen { display: grid; gap: 18px; width: 100%; height: 100%; padding: 6px 10px; }
  #sc-main { grid-template-columns: 1.1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
  #sc-main #t-ai { grid-row: 1 / 3; }
  #sc-main #t-vs { grid-column: 2; grid-row: 1; } #sc-main #t-chars { grid-column: 3; grid-row: 1; } #sc-main #t-stats { grid-column: 2; grid-row: 2; } #sc-main #t-adv { grid-column: 3; grid-row: 2; }
  #sc-adv { grid-template-columns: repeat(3, 1fr); grid-template-rows: auto 1fr; }
  #sc-adv .seg[disabled] { opacity: 0.35; cursor: default; }
  .advst canvas { position: absolute; left: 50%; top: 9%; width: 60%; height: 46%; transform: translateX(-50%); z-index: 1; }
  .advst .tt { left: 0; right: 0; bottom: 22%; text-align: center; font-size: clamp(22px, 4vh, 38px); }
  .advst .tt small { display: block; font-size: 15px; margin-bottom: 6px; }
  .advst .rec { left: 0; right: 0; bottom: 7%; text-align: center; font-size: 22px; letter-spacing: 2px; }
  #dlg { position: fixed; left: 50%; bottom: calc(var(--footH) + 18px); transform: translateX(-50%); width: min(860px, calc(100vw - 32px)); z-index: 20;
    display: flex; gap: 14px; align-items: stretch; background: #fff; border: 4px solid #22212e; border-radius: 10px; padding: 12px; box-shadow: 0 8px 0 rgba(0,0,0,0.2); cursor: pointer; }
  #dlgFace { width: 110px; height: 110px; flex: none; background: #f1eefb; border-radius: 8px; }
  #dlg .body { flex: 1; min-width: 0; }
  #dlgName { display: inline-block; font-family: var(--head); color: #fff; border-radius: 999px; padding: 3px 14px; font-size: 18px; }
  #dlgText { font-size: clamp(17px, 2.6vh, 22px); margin: 10px 2px 0; min-height: 2.6em; line-height: 1.35; }
  #dlg .hint { position: absolute; right: 14px; bottom: 8px; font-size: 13px; color: var(--muted); }
  #sc-chars { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; }
  .charcard canvas { position: absolute; left: 50%; top: 10%; width: 64%; height: 58%; transform: translateX(-50%); z-index: 1; }
  .charcard .tt { left: 0; right: 0; bottom: 9%; text-align: center; font-size: clamp(22px, 4vh, 40px); }
  .charcard .mine { position: absolute; z-index: 2; top: 6%; right: 7%; font-family: var(--head); font-size: 14px; background: #fff; color: var(--d); border-radius: 999px; padding: 2px 10px; display: none; }
  .charcard.sel .mine { display: block; }
  #sc-ai { grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr 1fr; }
  #sc-vs { grid-template-columns: 1.15fr 1fr 0.9fr; grid-template-rows: auto 1fr 1fr auto; }
  #sc-vs #t-rank { grid-row: 2 / 4; grid-column: 3; }

  #sc-vs .card { grid-column: 1 / 4; }
  #sc-vs #t-quick { grid-row: 2; grid-column: 1; } #sc-vs #t-local { grid-row: 3; grid-column: 1; }
  #sc-vs #t-create { grid-row: 2; grid-column: 2; } #sc-vs #t-join { grid-row: 3; grid-column: 2; }
  #sc-solo { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  #sc-psolo { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
  #sc-stats { grid-template-columns: 0.75fr 1.9fr; grid-template-rows: 1fr; }
  /* 내 정보 오른쪽: 탭 카드(요약 · 기록 · 랭크 · 순위표) */
  .infocard { display: flex; flex-direction: column; min-height: 0; padding: 12px 14px; }
  .ihead { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .itabs .seg { font-size: 17px; padding: 7px 18px; }
  .ibar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .ibar select, .ibar input { font-family: var(--font); font-size: 15px; border: 2px solid #cfd1dc; border-radius: 6px; padding: 4px 8px; background: #fff; }
  .ibody { flex: 1; min-height: 0; overflow: auto; padding-right: 4px; }
  .ibody h4 { margin: 14px 2px 8px; font-family: var(--head); font-weight: 400; font-size: 18px; color: #3a3850; }
  .ibody h4:first-child { margin-top: 2px; }
  .empty { color: var(--muted); padding: 30px 6px; text-align: center; }
  /* 기록: 경기 한 줄 */
  .mrow { display: grid; grid-template-columns: 6px 1.2fr 1.4fr 1fr 1.4fr 104px; align-items: center; gap: 12px; background: #f6f6fa; border-radius: 6px; margin-bottom: 6px; padding: 7px 10px 7px 0; min-height: 58px; }
  .mrow > .bar { align-self: stretch; border-radius: 6px 0 0 6px; background: #b7b5c8; }
  .mrow.w > .bar { background: #39c63c; } .mrow.l > .bar { background: #ff4559; } .mrow.p > .bar { background: #9a4fd8; }
  .mrow b { font-family: var(--head); font-weight: 400; font-size: 18px; display: block; }
  .mrow small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .mrow.w .mres b { color: #1a8027; } .mrow.l .mres b { color: #b01830; }
  .mvs { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .mvs canvas { width: 34px; height: 34px; flex: none; }
  .mvs span { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrank { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .mrank canvas { width: 34px; height: 34px; flex: none; }
  .mrank .up { color: #1a8027; } .mrank .down { color: #b01830; }
  .mact { display: flex; gap: 6px; justify-content: flex-end; }
  .mact button { font-family: var(--head); font-size: 16px; border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer; background: #2f78f0; color: #fff; box-shadow: 0 3px 0 #1747b0; }
  .mact button.dl { background: #6d6b80; box-shadow: 0 3px 0 #48465a; }
  .mact button.file { background: #fff; color: var(--ink); box-shadow: 0 3px 0 #cfd1dc; border: 2px solid #cfd1dc; padding: 5px 9px; }
  .mact .none { font-size: 13px; color: var(--muted); padding: 0 6px; }
  /* 랭크 */
  .rkhero { display: flex; gap: 22px; align-items: center; background: linear-gradient(135deg, #2b2450, #463a86); color: #fff; border-radius: 8px; padding: 16px 20px; }
  .rkhero canvas { width: 130px; height: 130px; flex: none; }
  .rkhero .t { font-family: var(--head); font-size: 34px; }
  .rkhero .s { opacity: 0.85; margin-top: 4px; }
  .rpbar { height: 12px; background: rgba(255,255,255,0.2); border-radius: 6px; margin-top: 10px; overflow: hidden; width: min(360px, 60vw); }
  .rpbar i { display: block; height: 100%; background: #ffe066; border-radius: 6px; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge { background: #f1eefb; border-radius: 6px; padding: 8px 12px; font-size: 14px; }
  .badge b { display: block; font-family: var(--head); font-weight: 400; font-size: 17px; }
  /* 순위표 */
  .lbhead { display: flex; align-items: center; gap: 14px; background: linear-gradient(180deg, #e8f5ff, #cfe6f7); border-radius: 8px; padding: 10px 16px; margin-bottom: 8px; }
  .lbhead canvas { width: 54px; height: 54px; }
  .lbhead .t { font-family: var(--head); font-size: 30px; color: #2c3f55; }
  .lbhead .s { margin-left: auto; text-align: right; color: #45607a; font-size: 14px; }
  .lbcols, .lbrow { display: grid; grid-template-columns: 70px 60px 90px 54px 1fr 110px; align-items: center; gap: 10px; }
  .lbcols { color: var(--muted); font-size: 13px; padding: 0 10px 4px; }
  .lbrow { background: #24384d; color: #fff; border-radius: 4px; margin-bottom: 4px; padding: 6px 10px; min-height: 58px; }
  .lbrow.first { min-height: 96px; background: linear-gradient(90deg, #2c4a66, #24384d); }
  .lbrow.me { outline: 3px solid #ffe066; }
  .lbrow .pl { font-family: var(--head); font-size: 30px; text-align: center; }
  .lbrow.first .pl { font-size: 54px; } .lbrow .star { color: #ffd23d; font-size: 18px; vertical-align: super; }
  .lbrow canvas { width: 46px; height: 46px; }
  .lbrow.first canvas.em { width: 64px; height: 64px; }
  .lbrow .pt { font-family: var(--head); font-size: 20px; }
  .lbrow .nm b { font-size: 19px; display: block; } .lbrow .nm small { opacity: 0.7; font-size: 13px; }
  .lbrow .wn { text-align: right; opacity: 0.9; }
  .lbfoot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .lbfoot input { flex: 1; max-width: 360px; font-family: var(--font); font-size: 15px; border: 2px solid #cfd1dc; border-radius: 6px; padding: 6px 10px; }
  .lbfoot .pg { margin-left: auto; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .lbfoot input { min-width: 0; }
  .ibar > button { font-family: var(--head); font-size: 15px; border: 2px solid #cfd1dc; background: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .ibar > button.warn { color: #b01830; }
  .mmode, .mres, .mrank > div { min-width: 0; }
  .mmode small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rkhero .note { font-size: 13px; opacity: 0.7; margin-top: 8px; }
  .badge small { font-size: 13px; color: var(--muted); }
  .lbrow small { display: block; font-size: 12px; opacity: 0.7; }
  .lbfoot button[disabled] { opacity: 0.4; cursor: default; }
  .lbfoot button { font-family: var(--head); border: 2px solid #cfd1dc; background: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; }

  .tile {
    --c: #3cc83c; --d: #1d8a2a;
    position: relative; border: 0; padding: 0; margin: 0; background: none; cursor: pointer; font: inherit; color: #fff;
    min-height: 0; min-width: 0; outline: none; text-align: left;
    filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.16));
    transition: transform 0.18s cubic-bezier(0.3, 1.6, 0.5, 1), filter 0.18s;
  }
  .tile .in, .tile .in::before { position: absolute; clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%); }
  .tile .in { inset: 0; background: var(--d); }
  .tile .in::before {
    content: ""; inset: 7px;
    background-color: var(--c);
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.24) 27%, transparent 29%),
      linear-gradient(160deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 45%, rgba(0,0,0,0.1));
    background-size: 12px 12px, 100% 100%;
  }
  .tile[data-act]:focus, .tile.sel {
    transform: scale(1.035) rotate(-1deg); z-index: 2;
    filter: drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff) drop-shadow(0 12px 14px rgba(0,0,0,0.3));
  }
  .tile:active { transform: scale(0.99); }
  .t-green  { --c: #39c63c; --d: #1a8027; }
  .t-yellow { --c: #ffc915; --d: #d08a00; }
  .t-purple { --c: #9a4fd8; --d: #5e2399; }
  .t-blue   { --c: #2f78f0; --d: #1747b0; }
  .t-orange { --c: #ff8a1c; --d: #c75a00; }
  .t-red    { --c: #ff4559; --d: #b01830; }

  .tt {
    position: absolute; z-index: 2; font-family: var(--head); font-weight: 400; line-height: 1; white-space: nowrap;
    font-size: clamp(28px, 6vh, 64px); color: #fff;
    text-shadow: 4px 0 0 var(--d), -4px 0 0 var(--d), 0 4px 0 var(--d), 0 -4px 0 var(--d),
                 3px 3px 0 var(--d), -3px 3px 0 var(--d), 3px -3px 0 var(--d), -3px -3px 0 var(--d), 0 8px 0 rgba(0,0,0,0.22);
  }
  .tt small { display: block; font-size: 0.42em; margin-bottom: 6px; }
  .art {
    position: absolute; z-index: 1; border: 5px solid #fff; border-radius: 3px; background: #1e174e;
    transform: rotate(-2deg); box-shadow: 0 5px 0 rgba(0,0,0,0.2);
  }
  .ico { position: absolute; z-index: 3; width: clamp(64px, 12vh, 104px); height: clamp(64px, 12vh, 104px); pointer-events: none; }
  .tile[data-act]:focus .ico { animation: bob 0.9s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0) scale(1, 1); } 45% { transform: translateY(-8px) scale(0.96, 1.05); } 80% { transform: translateY(0) scale(1.08, 0.92); } }
  .rec {
    position: absolute; z-index: 3; right: 7%; bottom: 13%; background: rgba(0,0,0,0.26); border-radius: 999px;
    padding: 4px 14px; font-size: clamp(14px, 2.2vh, 19px);
  }
  .tile .note { position: absolute; z-index: 3; left: 9%; bottom: 14%; font-size: clamp(14px, 2.2vh, 18px); opacity: 0.95; }

  /* 방 참가 입력 */
  .joinrow { position: absolute; z-index: 3; left: 9%; right: 8%; bottom: 14%; display: flex; gap: 8px; }
  .joinrow input {
    flex: 1; min-width: 0; font-family: var(--head); font-size: 22px; letter-spacing: 6px; text-align: center; text-transform: uppercase;
    border: 0; border-radius: 6px; padding: 6px 8px; color: var(--ink); box-shadow: inset 0 3px 0 rgba(0,0,0,0.12);
  }
  .mini {
    font-family: var(--head); font-size: 18px; border: 0; border-radius: 6px; padding: 6px 16px; cursor: pointer;
    background: #fff; color: var(--d, #1747b0); box-shadow: 0 4px 0 rgba(0,0,0,0.2);
  }
  .mini:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }

  /* 흰 카드 */
  .card {
    position: relative; background: #fff; border: 3px solid #cfd1dc; border-radius: 6px; padding: 12px 18px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.08); color: var(--ink); min-height: 0; overflow: auto;
  }
  .card h3 { margin: 0 0 8px; font-family: var(--head); font-weight: 400; font-size: 20px; color: #3a3850; }
  .netrow { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 16px; }
  .netrow input { font-family: var(--font); font-size: 15px; border: 2px solid #cfd1dc; border-radius: 6px; padding: 4px 8px; width: 210px; }
  .status { color: #d4570a; min-height: 20px; }
  .roomcode { font-family: var(--head); font-size: 34px; letter-spacing: 8px; color: #ff6a1f; }
  .lan { color: var(--muted); user-select: text; -webkit-user-select: text; }
  .lan b { color: var(--ink); font-weight: 400; }
  .ghostbtn { font-family: var(--font); font-size: 15px; border: 2px solid #cfd1dc; background: #fff; border-radius: 6px; padding: 4px 12px; cursor: pointer; color: var(--ink); }

  /* 내 정보 */
  .profile { position: absolute; z-index: 3; inset: 12% 10% 10% 11%; display: flex; flex-direction: column; gap: 10px; }
  .profile label { font-size: 15px; opacity: 0.9; }
  .profile input {
    font-family: var(--head); font-size: 26px; border: 0; border-radius: 6px; padding: 6px 10px; width: 100%; color: var(--ink);
    box-shadow: inset 0 3px 0 rgba(0,0,0,0.12);
  }
  .big { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .big div { background: rgba(0,0,0,0.22); border-radius: 8px; padding: 8px 12px; }
  .big b { display: block; white-space: nowrap; font-family: var(--head); font-weight: 400; font-size: clamp(20px, 3.4vh, 30px); }
  .big span { font-size: 14px; opacity: 0.9; }

            <button class="seg" style="--c:#2f78f0" data-act="pl:2" data-desc="1:1로 대전해.">2인</button>
            <button class="seg" style="--c:#2f78f0" data-act="pl:3" data-desc="로컬 대전은 빈자리를 CPU가 채우고, 온라인은 이 인원이 모이면 시작해. 3명 대전해. 마지막까지 살아남으면 승리야. 공격은 나를 공격한 사람에게, 없으면 점수 1등에게 가.">3인</button>
            <button class="seg" style="--c:#2f78f0" data-act="pl:4" data-desc="로컬 대전은 빈자리를 CPU가 채우고, 온라인은 이 인원이 모이면 시작해. 4명이 대전해. 마지막까지 살아남으면 승리야. 3~4인은 한 판 승부야.">4인</button>
          </div>
          <span class="lab">규칙</span>
          <div class="segs">
            <button class="seg" style="--c:#ff4559" data-act="rule:tsu" data-desc="기본 규칙이야. 연쇄를 직접 쌓아서 공격해.">통상</button>
            <button class="seg" style="--c:#ff5fd0" data-act="rule:fever" data-desc="온라인은 방을 만든 사람의 규칙을 따라. 상쇄할 때마다 피버 게이지가 차고, 7칸이 차면 연쇄 씨앗판이 떨어지는 피버가 시작돼. 뿌요뿌요에만 적용돼.">피버</button>
            <button class="seg" style="--c:#ff8a1c" data-act="rule:bigbang" data-desc="방해 공격 없이 라운드마다 같은 퍼즐(뿌요는 연쇄 씨앗판, 테트리스는 줄 채우기)을 동시에 풀어. 더 많이·더 빨리 완성한 사람이 이기고 나머지는 체력이 깎여.">빅뱅</button>
            <button class="seg" style="--c:#2f78f0" data-act="rule:swap" data-desc="뿌요뿌요 판과 테트리스 판을 둘 다 가지고 25초마다 번갈아 써. 쌓인 공격은 바뀐 판으로 넘어가.">스왑</button>
            <button class="seg" style="--c:#9a4fd8" data-act="rule:party" data-desc="2분 동안 점수로 겨뤄. 조각에 붙은 ★아이템을 터뜨리면 방해 폭탄·판 정리·조작 반전 같은 효과가 나와. 꼭대기까지 차도 탈락하지 않고 점수가 깎여.">파티</button>
            <button class="seg" style="--c:#1aa0e8" data-act="rule:fusion" data-desc="뿌요 쌍과 테트리미노가 한 판에 섞여 나와. 블록은 뿌요를 뚫고 떨어지고, 줄을 채우거나 뿌요 4개를 이으면 지워져. 스타일과 상관없이 모두 퓨전 판으로 겨뤄.">퓨전</button>
          </div>
          <span class="lab">판</span>
          <div class="segs">
            <button class="seg" style="--c:#39c63c" data-act="board:wide" data-desc="뿌요 판을 가로 8칸 × 세로 14칸으로 넓게 써.">넓게 8×14</button>
            <button class="seg" style="--c:#39c63c" data-act="board:classic" data-desc="온라인은 방을 만든 사람의 판 크기를 따라. 원작과 같은 가로 6칸 × 세로 12칸 판이야. 3열 맨 위가 막히면 끝나.">원작 6×12</button>
            <button class="seg" style="--c:#39c63c" data-act="board:tiny" data-desc="작은 뿌요로 가로 12칸 × 세로 24칸을 쓰는 타이니 뿌요야. 큰 연쇄를 길게 짤 수 있고, 방해뿌요가 한 번에 60개까지 떨어져.">타이니</button>
          </div>
          <span class="lab">로컬 2P</span>
          <div class="segs">
            <button class="seg" style="--c:#ff4559" data-act="style:p2:puyo" data-desc="로컬 대전에서 2P가 뿌요뿌요로 플레이해.">뿌요뿌요</button>
            <button class="seg" style="--c:#2f78f0" data-act="style:p2:tetris" data-desc="로컬 대전에서 2P가 테트리스로 플레이해.">테트리스</button>
          </div>
        </div>
        <button class="tile t-yellow" id="t-quick" data-act="quick" data-desc="먼저 기다리고 있던 사람과 바로 대전을 시작해.">
          <span class="in"></span>
          <canvas class="art" data-art="vs" style="left:52%;top:14%;width:40%;height:66%"></canvas>
          <span class="tt" style="left:8%;bottom:18%">빠른 매칭</span>
          <span class="rec" id="recOnline" style="right:auto;left:9%;bottom:auto;top:18%"></span>
        </button>
        <button class="tile t-orange" id="t-create" data-act="create" data-desc="방을 만들고 4자리 코드를 친구에게 알려줘.">
          <span class="in"></span>
          <span class="tt" style="left:10%;top:22%">방 만들기</span>
          <canvas class="ico" data-col="1" style="right:6%;top:12%"></canvas>
        </button>
        <div class="tile t-blue" id="t-join" tabindex="0" data-act="join" data-desc="친구가 알려준 4자리 방 코드를 넣고 참가해.">
          <span class="in"></span>
          <span class="tt" style="left:10%;top:16%">방 참가</span>
          <canvas class="ico" data-col="3" style="right:6%;top:6%"></canvas>
          <div class="joinrow"><input id="code" maxlength="4" placeholder="코드" autocomplete="off" spellcheck="false"><button class="mini" id="bJoin">참가</button></div>
        </div>
        <button class="tile t-green" id="t-local" data-act="local" data-desc="한 키보드(또는 게임패드 2개)로 둘이 대전해. 1P는 WASD·Q/E·R, 2P는 방향키·. /·, 를 써.">
          <span class="in"></span>
          <span class="tt" style="left:9%;top:24%"><small>한 컴퓨터에서 둘이</small>로컬 대전</span>
          <canvas class="ico" data-col="2" style="right:5%;bottom:8%"></canvas>
        </button>
        <button class="tile t-purple" id="t-rank" data-act="ranked" data-desc="실력이 비슷한 사람과 1:1로 겨뤄(원작 6×12 판·통상 규칙·2선승). 시즌마다 처음 10번은 배치, 그다음부터 RP를 모아 브론즈 1부터 마스터까지 올라가. 도중에 나가면 패배야.">
          <span class="in"></span>
          <canvas class="art" data-art="rank" style="left:14%;top:8%;width:72%;height:40%"></canvas>
          <span class="tt" style="left:12%;bottom:30%">랭크전</span>
          <span class="rec" id="recRank" style="right:7%;left:auto;top:5%;bottom:auto"></span>
        </button>
        <div class="card">
          <div class="netrow">
            <span>서버 <input id="srv" spellcheck="false"></span>
            <span id="roomBox" class="hidden">방 코드 <span class="roomcode" id="roomCode"></span></span>
            <button class="ghostbtn hidden" id="bCancel">취소</button>
          </div>
          <p class="status" id="netStatus"></p>
          <p class="lan hidden" id="lanInfo"></p>
        </div>
      </section>

      <section id="sc-psolo" class="screen hidden">
        <button class="tile t-blue" id="t-pendless" data-act="psolo:endless" data-desc="방해뿌요 없이 혼자 끝까지 쌓아 보는 연습이야. 레벨이 오르면 빨라져.">
          <span class="in"></span><span class="tt" style="left:10%;top:24%">끝없이</span><span class="rec" id="recPEndless"></span>
        </button>
        <button class="tile t-purple" id="t-pefever" data-act="psolo:efever" data-desc="연쇄 씨앗판이 계속 떨어지는 피버만 하는 모드야. 30초에서 시작하고, 긴 연쇄를 터뜨릴수록 시간이 늘어나.">
          <span class="in"></span><span class="tt" style="left:10%;top:24%">엔드리스 피버</span><span class="rec" id="recPEfever"></span>
        </button>
      </section>

      <section id="sc-solo" class="screen hidden">
        <button class="tile t-blue" id="t-marathon" data-act="tsolo:marathon" data-desc="150줄을 지우는 동안 최고 점수를 노려. 10줄마다 레벨이 오르고 빨라져.">
          <span class="in"></span><span class="tt" style="left:10%;top:24%">마라톤</span><span class="rec" id="recMarathon"></span>
        </button>
        <button class="tile t-green" id="t-sprint" data-act="tsolo:sprint" data-desc="40줄을 얼마나 빨리 지우는지 겨루는 기록 모드야.">
          <span class="in"></span><span class="tt" style="left:10%;top:24%">스프린트</span><span class="rec" id="recSprint"></span>
        </button>
        <button class="tile t-orange" id="t-ultra" data-act="tsolo:ultra" data-desc="3분 동안 최대한 많은 점수를 모아.">
          <span class="in"></span><span class="tt" style="left:10%;top:24%">울트라</span><span class="rec" id="recUltra"></span>
        </button>
        <button class="tile t-purple" id="t-endless" data-act="tsolo:endless" data-desc="끝없이 쌓으며 연습해. 10줄마다 빨라져.">
          <span class="in"></span><span class="tt" style="left:10%;top:24%">끝없이</span><span class="rec" id="recEndless"></span>
        </button>
      </section>

      <section id="sc-stats" class="screen hidden">
        <div class="tile t-purple" id="t-profile">
          <span class="in"></span>
          <div class="profile">
            <label for="pName">닉네임</label>
            <input id="pName" maxlength="10" spellcheck="false">
            <div class="big">
              <div><b id="pGames">0</b><span>플레이 횟수</span></div>
              <div><b id="pRate">-</b><span>승률</span></div>
              <div><b id="pWins">0</b><span>승리</span></div>
              <div><b id="pTime">0분</b><span>플레이 시간</span></div>
            </div>
          </div>
        </div>
        <div class="card infocard" id="infoCard">
          <div class="ihead">
            <div class="segs itabs">
              <button class="seg" style="--c:#9a4fd8" data-act="itab:sum" data-desc="플레이 횟수·승률·최고 연쇄 같은 기록을 모드별로 한눈에 봐.">요약</button>
              <button class="seg" style="--c:#2f78f0" data-act="itab:hist" data-desc="지금까지 한 경기 목록이야. 종목을 골라 거르고, 오른쪽 ⤓로 리플레이를 받아 ▶로 볼 수 있어.">기록</button>
              <button class="seg" style="--c:#5e2399" data-act="itab:rank" data-desc="이번 시즌 내 랭크·RP·배치 진행과 지난 시즌 기록이야.">랭크</button>
              <button class="seg" style="--c:#ff8a1c" data-act="itab:board" data-desc="플래티넘 이상 랭크전 순위표야. 시즌을 골라 지난 시즌 순위도 볼 수 있어.">순위표</button>
            </div>
            <div class="ibar" id="iBar"></div>
          </div>
          <div class="ibody" id="iBody"></div>
          <input type="file" id="rpFile" accept=".json,application/json" class="hidden">
        </div>
      </section>
    </div>
    <div class="mdesc" id="mDesc"></div>
  </div>

  <div id="dlg" class="hidden"><canvas id="dlgFace"></canvas><div class="body"><span id="dlgName"></span><p id="dlgText"></p></div><span class="hint">Enter 다음 · Esc 건너뛰기</span></div>

  <!-- ================= 게임 ================= -->
  <div id="game" class="hidden">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="overlay" class="hidden">
        <div class="result t-yellow" id="resultBox">
          <span class="in"></span>
          <h2 class="tt" id="ovTitle" style="position:relative">승리!</h2>
          <p id="ovSub"></p>
          <div class="chips" id="ovStats"></div>
          <div class="btns">
            <button class="btn" id="bResume">계속하기</button>
            <button class="btn" id="bRetry">다시 하기</button>
            <button class="btn" id="bRematch">다시 하기</button>
            <button class="btn ghost" id="bLeave">나가기</button>
            <button class="btn ghost" id="bMenu">메뉴로</button>
            <button class="btn ghost" id="bForfeit">기권하고 나가기</button>
          </div>
        </div>
      </div>
    </div>
    <div class="pad" id="pad">
      <button data-k="left" aria-label="왼쪽">◀</button>
      <button data-k="down" aria-label="아래">▼</button>
      <button data-k="right" aria-label="오른쪽">▶</button>
      <button data-k="hard" aria-label="하드드롭">⤓</button>
      <button data-k="ccw" aria-label="반시계 회전">↺</button>
      <button data-k="cw" aria-label="시계 회전">↻</button>
      <button data-k="hold" aria-label="홀드">H</button>
      <button data-k="menu" aria-label="일시정지">Ⅱ</button>
    </div>
  </div>

<script src="js/core.js"></script>
<script src="js/fever.js"></script>
<script src="js/puyo.js"></script>
<script src="js/tetris.js"></script>
<script src="js/game.js"></script>
<script src="js/stats.js"></script>
<script src="js/ui.js"></script>
<script src="js/info.js"></script>
<script src="js/play.js"></script>
<script src="js/input.js"></script>
<script src="js/net.js"></script>
<script src="js/replay.js"></script>
<script src="js/bigbang.js"></script>
<script src="js/swap.js"></script>
<script src="js/party.js"></script>
<script src="js/fusion.js"></script>
<script src="js/chars.js"></script>
<script src="js/adventure.js"></script>
<script src="js/main.js"></script>
</body>
</html>
